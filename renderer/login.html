<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ Prompt Pak</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Noto+Sans+Thai:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#2A1750;--name:#4A3382;--low:#E7D8F8;--road:#D2BDF0;--ink:#2A1750;--pur:#6A3AA2;--hot:#C2287F;--yel:#FFD66B;--body:'IBM Plex Sans Thai',sans-serif;--disp:'Noto Sans Thai','IBM Plex Sans Thai',sans-serif;--bar:64px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:relative;height:100vh;height:100dvh;overflow:hidden;overflow:clip;background:radial-gradient(ellipse at 50% 30%,#3A2270 0,var(--bg) 70%)}
/* ===== แถบขาว ชื่อระบบ ===== */
.bar{position:absolute;left:0;right:0;top:0;height:var(--bar);background:#fff;display:flex;align-items:center;gap:.8rem;padding:0 1.4rem;z-index:30;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bar .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6A3AA2,#C2287F);display:grid;place-items:center;flex:none}
.bar b{font:700 1.55rem var(--body);letter-spacing:.07em;color:var(--ink)}
.bar i{font:700 .9rem var(--body);font-style:normal;color:#fff;background:var(--hot);padding:.2rem .8rem;border-radius:99px;letter-spacing:.2em}
/* ===== เลเยอร์บน : ชื่อโรงแรมนิ่ง + ของลอย ===== */
.name{position:absolute;left:0;right:0;top:calc(var(--bar) + 2vh);text-align:center;font:900 clamp(3.6rem,17vh,11rem)/1.35 var(--disp);color:var(--name);white-space:nowrap;user-select:none;z-index:1}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#A78BE0;opacity:.2;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.85}}
.float{position:absolute;z-index:2;pointer-events:none}
.plane{top:calc(var(--bar) + 1.5vh);left:0;width:130px;animation:fly 34s linear infinite;animation-delay:-8s}
@keyframes fly{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 40px))}}
.balloon{left:5%;top:36vh;width:92px;animation:bl 6s ease-in-out infinite;transform-origin:50% 0}
@keyframes bl{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.moon{right:6%;top:calc(var(--bar) + 6vh);width:70px;animation:bl 8s ease-in-out infinite}
/* ===== เลเยอร์ล่าง ===== */
.stage,.sky{contain:paint}
.sky{position:absolute;left:0;right:0;bottom:30%;height:min(25vh,210px);z-index:2;overflow:hidden;pointer-events:none}
.sky .trk{display:flex;height:100%;width:max-content;animation:run 150s linear infinite}
.sky svg{height:100%;width:auto;flex:none;display:block}
.low{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(var(--low) 0 74%,var(--road) 74%);z-index:2}
.tape{position:absolute;left:0;bottom:.6vh;display:flex;width:max-content;animation:run 78s linear infinite;z-index:4}
.tape>svg{height:min(35vh,300px);width:auto;flex:none;overflow:visible;display:block}
@keyframes run{to{transform:translateX(-50%)}}
.sw{fill:#CDB6EE}.sw.l{fill:var(--yel);animation:lit 8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes lit{0%,100%{opacity:.2}50%{opacity:1}}
.wel .sw{fill:var(--yel);animation:none;opacity:1}
.fw{transform-box:fill-box;transform-origin:center;animation:spn 60s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
/* ตัวละคร + ของเคลื่อนไหว */
.wk1,.wk2{transform-box:fill-box;transform-origin:50% 0;animation:wk .55s ease-in-out infinite alternate}.wk2{animation-direction:alternate-reverse}
@keyframes wk{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.arm{transform-box:fill-box;transform-origin:50% 8%}.as{animation:as .55s ease-in-out infinite alternate}.as.b{animation-direction:alternate-reverse}
@keyframes as{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.wave{animation:wv .45s ease-in-out infinite alternate}@keyframes wv{from{transform:rotate(145deg)}to{transform:rotate(195deg)}}
.br{transform-box:fill-box;transform-origin:50% 100%;animation:br 3s ease-in-out infinite}@keyframes br{50%{transform:scaleY(1.025)}}
.bump{transform-box:fill-box;transform-origin:50% 100%;animation:bp 1.3s ease-in-out infinite}@keyframes bp{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-2px)}}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wb 1.3s ease-in-out infinite}.wob.d{animation-delay:-.4s}@keyframes wb{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sy 4.5s ease-in-out infinite}@keyframes sy{50%{transform:rotate(4deg)}}
.whl{transform-box:fill-box;transform-origin:center;animation:spn .45s linear infinite}
.hd{transform-box:fill-box;transform-origin:50% 100%;animation:spn 12s linear infinite}.hd.h{animation-duration:140s}
.dl,.dr{transform-box:fill-box;animation:dor 9s ease-in-out infinite}.dl{transform-origin:0 50%}.dr{transform-origin:100% 50%}
@keyframes dor{0%,15%{transform:scaleX(1)}27%,62%{transform:scaleX(.07)}74%,100%{transform:scaleX(1)}}
.stp{animation:stp 9s ease-in-out infinite}@keyframes stp{0%,28%{transform:translateX(0)}42%,54%{transform:translateX(66px)}68%,100%{transform:translateX(0)}}
.led{animation:led 1.4s steps(1) infinite}@keyframes led{50%{opacity:.2}}
.glow{animation:gl 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{50%{opacity:.35;transform:scale(1.15)}}
.scr{animation:sc 2.4s steps(1) infinite}@keyframes sc{0%{fill:#7FD6EE}30%{fill:#FFD66B}60%{fill:#F29AC1}}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:rg 3.4s ease-out infinite}@keyframes rg{0%,40%{opacity:0;transform:scale(.4)}46%{opacity:.9}100%{opacity:0;transform:scale(2.6)}}
.ding{transform-box:fill-box;transform-origin:50% 100%;animation:dn 3.4s ease-in-out infinite}@keyframes dn{0%,40%,100%{transform:none}44%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}56%{transform:rotate(-4deg)}}
.hop{animation:hop .9s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.trunk{animation:tr 5s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}@keyframes tr{0%,100%{transform:rotate(-75deg)}}
.lift{animation:lf 3.6s ease-in-out infinite}@keyframes lf{0%,100%{transform:translate(0,0)}45%{transform:translate(-20px,-26px) rotate(-8deg)}70%{transform:translate(10px,0)}}
.runk{animation:rk 1.8s ease-in-out infinite alternate}@keyframes rk{to{transform:translateX(-34px)}}
.balx{transform-box:fill-box;transform-origin:50% 100%;animation:bx 2.2s ease-in-out infinite}@keyframes bx{50%{transform:rotate(9deg) translateY(-5px)}}
.rip{animation:rp 3s linear infinite}@keyframes rp{to{transform:translateX(30px)}}
.dive{animation:dv 5s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes dv{0%{transform:translate(0,0) rotate(0);opacity:1}30%{transform:translate(-44px,-52px) rotate(180deg)}58%{transform:translate(-100px,10px) rotate(380deg);opacity:1}60%,100%{transform:translate(-100px,16px) rotate(380deg);opacity:0}}
.spl{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:sp 5s ease-out infinite}@keyframes sp{0%,58%{opacity:0;transform:scale(.2)}64%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.5) translateY(-10px)}}
.steam{animation:st 2.4s ease-in infinite;opacity:0}.steam.b{animation-delay:.8s}.steam.c{animation-delay:1.6s}
@keyframes st{0%{opacity:0;transform:translateY(6px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.cloud{animation:cd 14s linear infinite}@keyframes cd{from{transform:translateX(-60px)}to{transform:translateX(230px)}}
.sprk{transform-box:fill-box;transform-origin:center;animation:tw2 1.8s ease-in-out infinite}@keyframes tw2{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(30deg);opacity:1}}
/* ===== กล่องล็อกอิน : มินิมอล คอนทราสสูง จัดวางตัวอักษรเป็นหลัก ===== */
.boxes{position:absolute;left:50%;bottom:33%;transform:translateX(-50%);display:flex;gap:1rem;z-index:8;align-items:stretch}
.bx{--fg:#2A1750;--bgc:#FFF8EC;width:min(27vw,200px);height:min(39vh,320px);flex:none;box-sizing:border-box;background:var(--bgc);color:var(--fg);border-radius:6px;padding:.85rem 1rem 1rem;display:flex;flex-direction:column;cursor:pointer;position:relative;transition:transform .22s cubic-bezier(.2,1.3,.4,1),background .2s,box-shadow .2s,opacity .4s;box-shadow:0 0 0 0 transparent;animation:rise .7s cubic-bezier(.2,1.2,.4,1) both;-webkit-user-select:none;user-select:none}
.bx:nth-child(2){animation-delay:.08s}.bx:nth-child(3){animation-delay:.16s}
@keyframes rise{from{transform:translateY(50px);opacity:0}}
.bx:hover{box-shadow:0 0 0 3px #FFD66B}
.bh{display:flex;justify-content:space-between;align-items:center;font:600 .72rem 'IBM Plex Mono','IBM Plex Sans Thai',monospace;letter-spacing:.12em;padding-bottom:.55rem;border-bottom:1.5px solid currentColor}
.bh em{font-style:normal;font-family:var(--body);letter-spacing:.04em;font-weight:600}
.big{margin-top:.75rem;font:900 clamp(2.3rem,7.6vh,3.5rem)/1.22 var(--disp);letter-spacing:-.01em;transition:.2s}
.sub{margin-top:.55rem;font:400 .8rem/1.45 var(--body);opacity:.72}
.arr{position:absolute;right:1rem;bottom:1rem;width:42px;height:42px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;transition:.2s}
.arr svg{animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{50%{transform:translateX(4px)}}
.bx:hover .arr{background:var(--fg);color:var(--bgc)}
.pw{display:none;flex-direction:column;margin-top:auto}
.fld{width:100%;border:0;border-bottom:1.5px solid currentColor;background:none;color:inherit;font:600 1rem 'IBM Plex Mono','IBM Plex Sans Thai',monospace;padding:.6rem 0;outline:0;border-radius:0;-webkit-appearance:none}
.fld.pin{letter-spacing:.5em}.fld::placeholder{color:inherit;opacity:.5;letter-spacing:.04em;font-family:var(--body);font-weight:400;font-size:.9rem}
.go{margin-top:.9rem;border:1.5px solid currentColor;border-radius:11px;background:transparent;color:inherit;font:700 .95rem var(--body);padding:.7rem;cursor:pointer;transition:.15s}
.go:hover,.go.rdy{background:var(--fg);color:#FFD66B}
.bx.on{--bgc:#FFD66B;box-shadow:0 0 0 4px #fff,0 12px 0 rgba(0,0,0,.28)}
.bx.on .pw{display:flex}.bx.on .arr,.bx.on .sub{display:none}
.okb{display:none;margin-top:auto;flex-direction:column;gap:.5rem}
.okb svg{width:40px;height:40px}.okb path{stroke-dasharray:40;stroke-dashoffset:40}
.err{font:600 .8rem/1.35 var(--body);color:#C0123F;margin-bottom:.3rem}.bx[data-k=x] .err{color:#FFC2CF}.err[hidden]{display:none}
.go[disabled]{opacity:.6;pointer-events:none}
.bx.ok{--bgc:#9BE7B5}.bx.ok .pw,.bx.ok .arr,.bx.ok .sub{display:none}.bx.ok .okb{display:flex}.bx.ok .okb path{animation:dr .5s .15s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.bx[data-k=o]{--fg:#D81B7A}
.bx[data-k=x]{--bgc:rgba(72,72,84,.5);--fg:#fff;-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.bx[data-k=x]:hover{box-shadow:inset 0 0 0 1.5px #fff}
.bx[data-k=x].on{--bgc:rgba(66,66,78,.78);box-shadow:inset 0 0 0 2px #fff}
.bx[data-k=x]:hover .arr{background:#fff;color:#2A1750}
.bx[data-k=x] .arr svg{animation:none;transition:transform .25s}.bx[data-k=x]:hover .arr svg{transform:rotate(90deg)}
.bx[data-k=x] .fld::placeholder{opacity:.75}
.bx[data-k=x].on .big{font-size:clamp(1.7rem,5.2vh,2.4rem);margin-top:.5rem}
.bx[data-k=x].on .fld{padding:.45rem 0}.bx[data-k=x].on .go{margin-top:.6rem;padding:.6rem}
.bx[data-k=x] .go:hover,.bx[data-k=x] .go.rdy{background:#fff;color:#2A1750}
.bx[data-k=x].ok{--bgc:#9BE7B5;--fg:#2A1750;box-shadow:none}
.wel .bx:not(.ok){opacity:.28;pointer-events:none}
@media (max-width:700px){.boxes{gap:.5rem}.bx{width:30vw;padding:.7rem .6rem}.big{font-size:1.7rem}.balloon,.moon{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="stage" id="stage">
 <div class="bar"><div class="mk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6" fill="#fff"/></svg></div><b>PROMPT PAK</b></div>

 <svg class="float plane" viewBox="0 0 130 40"><path d="M70 20l42-6 10 6-10 6z" fill="#fff"/><path d="M88 18l-12-14h8l14 14zM88 22l-12 14h8l14-14z" fill="#E6DAF8"/><path d="M-10 20h74" stroke="#fff" stroke-width="2" stroke-dasharray="7 7" opacity=".6"/></svg>
 <svg class="float balloon" viewBox="-50 -10 100 150"><path d="M0 0C-52 0-54 56 0 78C54 56 52 0 0 0z" fill="#F29AC1"/><path d="M0 0C-20 12-20 60 0 78C20 60 20 12 0 0z" fill="#FFD66B"/><path d="M-20 70h40l-6 14h-28z" fill="#6A3AA2"/><path d="M-12 84L-8 104h16l4-20" fill="#B07A45"/></svg>

  <div class="bx" data-k="s"><div class="bh"><span>02</span><em class="tg"></em></div><div class="big" data-b="พนัก<br>งาน">พนัก<br>งาน</div><div class="sub">พนักงานต้อนรับ<br>เมนูหน้าเคาน์เตอร์</div><span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span>

  <div class="bx" data-k="x"><div class="bh"><span>03</span><em class="tg"></em></div><div class="big" data-b="บัญชี<br>อื่น">บัญชี<br>อื่น</div><div class="sub">เพิ่มบัญชีอื่น<br>ใส่ชื่อผู้ใช้และรหัส</div><span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
   <div class="pw"><div class="err" hidden></div><input class="fld user" placeholder="ชื่อผู้ใช้" autocomplete="off"><input class="fld pin" type="password" inputmode="numeric" maxlength="12" placeholder="รหัส PIN" autocomplete="off"><button class="go">เข้าสู่ระบบ</button></div>

 </div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$('#stars').innerHTML=Array.from({length:24},(_,i)=>`<i style="left:${(i*37+11)%100}%;top:${(i*53+7)%46+10}%;animation-delay:${(i%7)*.6}s"></i>`).join('');

/* ================= เงาฉากหลัง (เลื่อนช้า) : ศาลาไทย ตึกโรงแรม บังกะโล ปาล์ม ชิงช้าสวรรค์ ร่มชายหาด ================= */
(function(){
 const N='#E7D8F8',Fr='#D5BFF0',Dk='#CDB6EE';let h='',n=0;
 const win=(x,y,w,hh,l)=>`<rect class="sw${l?' l':''}" style="--d:${(n++*.9%7).toFixed(1)}s" x="${x}" y="${y}" width="${w}" height="${hh}" rx="2"/>`;
 const palm=(x,hh,lean)=>`<g fill="none" stroke="${N}" stroke-linecap="round"><path d="M${x} 222Q${x+lean} ${222-hh/2} ${x+lean*1.4} ${222-hh}" stroke-width="10"/><g class="sway" stroke-width="8"><path d="M${x+lean*1.4} ${222-hh}q-44-10-66 20M${x+lean*1.4} ${222-hh}q44-10 66 20M${x+lean*1.4} ${222-hh}q-34-38-70-24M${x+lean*1.4} ${222-hh}q34-38 70-24M${x+lean*1.4} ${222-hh}q0-36-4-46"/></g></g>`;
 // ฉากไกล
 h+=`<path d="M0 222V150Q100 106 200 138T400 130T600 146T800 114T1000 142T1200 124T1400 146T1600 150V222z" fill="${Fr}"/>`;
 [[90,100,40],[470,92,56],[740,110,46],[1060,96,60],[1500,100,42]].forEach(([x,y,w])=>h+=`<rect x="${x}" y="${y+60}" width="${w}" height="${162-y}" fill="${Fr}"/>`);
 // ศาลาไทย
 h+=`<rect x="64" y="150" width="112" height="72" fill="${N}"/><path d="M26 152Q120 86 214 152Q120 130 26 152z" fill="${N}"/><path d="M62 120Q120 54 178 120Q120 100 62 120z" fill="${N}"/><path d="M120 66V38Q130 34 127 24" stroke="${N}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M26 152q-10-6-8-16M214 152q10-6 8-16" stroke="${N}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 h+=win(84,166,18,32,1)+win(138,166,18,32);
 h+=palm(262,118,10);
 // ตึกโรงแรมใหญ่
 h+=`<rect x="330" y="40" width="190" height="182" fill="${N}"/><rect x="362" y="24" width="126" height="22" rx="8" fill="${N}"/><rect x="422" y="-4" width="4" height="30" fill="${N}"/><path d="M426 -4l26 8-26 8z" fill="${N}"/><rect x="376" y="52" width="98" height="24" rx="9" fill="${Dk}"/><text x="425" y="70" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="3" fill="${N}" font-family="Chakra Petch,sans-serif">HOTEL</text>`;
 for(let r=0;r<5;r++)for(let c=0;c<6;c++){h+=win(346+c*28,90+r*24,17,14,(r*6+c)%4===0)}
 for(let r=0;r<2;r++)h+=`<rect x="340" y="${103+r*48}" width="170" height="3" fill="${Dk}"/>`;
 h+=`<rect x="404" y="196" width="42" height="26" rx="4" fill="${Dk}"/>`;for(let i=0;i<5;i++)h+=`<path d="M${398+i*13} 186h13l-3 12h-7z" fill="${i%2?Dk:N}"/>`;
 // ปีกตึกเตี้ย + บังกะโลหลังคามุงจาก
 h+=`<rect x="520" y="112" width="150" height="110" fill="${N}"/>`;for(let c=0;c<5;c++)h+=win(534+c*27,128,16,18,c%2)+win(534+c*27,164,16,18,(c+1)%3===0);
 h+=`<path d="M700 150L790 70 880 150z" fill="${N}"/><path d="M730 140L790 86M760 144L800 100M790 148L826 114M820 148L848 124" stroke="${Dk}" stroke-width="3" fill="none"/><rect x="722" y="150" width="136" height="72" fill="${N}"/><rect x="772" y="170" width="34" height="52" rx="17" fill="${Dk}"/>`;

  try{r=await fetch(TOP.location.origin+'/api/app?part=pin',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({role:k,pin:pin.value.trim()})});
   if(r.status===429)msg='ใส่ PIN ผิดหลายครั้ง กรุณารอ 15 นาที';
   else if(r.status!==401&&!r.ok){let t='';try{t=(await r.json()).error||''}catch(_){}msg='ระบบขัดข้อง (รหัส '+r.status+') '+t}}catch(_){msg='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'}
  if(r&&r.ok){bx.classList.add('ok');tg.textContent='✓';big.innerHTML='ยินดี<br>ต้อนรับ';document.getElementById('stage').classList.add('wel');setTimeout(()=>TOP.location.reload(),900);return}
  go.disabled=false;go.textContent='เข้าสู่ระบบ';pin.value='';go.classList.remove('rdy');say(msg);pin.focus()});
});
</script></body></html>
