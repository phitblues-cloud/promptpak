 {n:'พนักงานบริษัทเดินทางด่วน',c:'#C2264B',cnt:24,pct:28,nights:'2.1 คืน',spend:'4,300 ฿',rep:'61%',sat:'4.3',people:3,

 {n:'ครอบครัวพักผ่อนสุดสัปดาห์',c:'#E0762F',cnt:21,pct:24,nights:'2.0 คืน',spend:'5,100 ฿',rep:'38%',sat:'4.1',people:5,

  note:'พักคืนเดียวแล้วไปต่อ ตอนเช็คเอาท์คือโอกาสเดียวที่จะขอ LINE และเชิญเป็นสมาชิก ก่อนที่เขาจะขับต่อไป',

  how:['บอกราคาและเวลาเช็คอินชัดตั้งแต่ประโยคแรก','ขอเบอร์/LINE ตอนเช็คอินเพื่อทักกลับมา','เสนอสมาชิกถ้าเดินทางเส้นนี้บ่อย']}];
/* ---------- 3D (เขียนเอง · ภาพเฉียงมุมสูง หมุนได้) ---------- */
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),stage=document.getElementById('stage');let W=0,H=0,S=30,dpr=Math.min(2,devicePixelRatio||1);
let az=.6,azT=.6,drag=null;
function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(W/31,H/21.5)}
function P(x,y,z){const c=Math.cos(az),s=Math.sin(az),X=x*c-z*s,Z=x*s+z*c;return [W/2+(X-Z)*.866*S,H*.6+(X+Z)*.5*S-y*S*1.0,X+Z]}
const sh=(hex,k)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return `rgb(${f(r)},${f(g)},${f(b)})`};
function box(o){ // {x,z,w,d,h,y0,c}
 const x0=o.x-o.w/2,x1=o.x+o.w/2,z0=o.z-o.d/2,z1=o.z+o.d/2,y0=o.y0||0,y1=y0+o.h;
 const faces=[ {n:[0,1,0],v:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],k:1.08},{n:[1,0,0],v:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],k:.86},{n:[-1,0,0],v:[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]],k:.86},
  {n:[0,0,1],v:[[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],[x1,y0,z1]],k:.72},{n:[0,0,-1],v:[[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[x1,y0,z0]],k:.72}];
 const c=Math.cos(az),s=Math.sin(az);
 return {depth:P(o.x,y0+o.h/2,o.z)[2]+(o.bias||0),draw(){faces.forEach(f=>{const nx=f.n[0]*c-f.n[2]*s,nz=f.n[0]*s+f.n[2]*c;if(f.n[1]!==1&&nx+nz<=0)return;
   cx.beginPath();f.v.forEach((p,i)=>{const q=P(...p);i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])});cx.closePath();cx.fillStyle=sh(o.c,f.k);cx.fill();if(o.edge){cx.strokeStyle='#0000000d';cx.stroke()}})}}}
const PATH=[[-8,2.6],[-3.2,2.6],[-3.2,-1.4],[2.2,-1.4],[6.6,-1.4]],SPT=[0,1,3,4];
function scene(){const it=[];
 it.push(box({x:0,z:0,w:21,d:13,h:.5,y0:-.5,c:'#E8DCCB',bias:-99}));it.push(box({x:0,z:0,w:20,d:12,h:.12,y0:0,c:'#CFE3C2',bias:-98}));
 for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1];it.push(box({x:(a[0]+b[0])/2,z:(a[1]+b[1])/2,w:Math.abs(b[0]-a[0])+1.1,d:Math.abs(b[1]-a[1])+1.1,h:.05,y0:.12,c:'#E9DDC9',bias:-90}))}
 it.push(box({x:-3.2,z:5,w:3.6,d:2,h:1.7,c:'#8B3FA8',edge:1}));it.push(box({x:-3.2,z:5,w:3.9,d:2.3,h:.28,y0:1.7,c:'#4B2477'}));
 it.push(box({x:2.2,z:-4.2,w:4,d:2.2,h:1.5,c:'#F0C27B',edge:1}));it.push(box({x:2.2,z:-4.2,w:4.3,d:2.5,h:.28,y0:1.5,c:'#E0762F'}));
 [5.2,7,8.8].forEach((x,i)=>{it.push(box({x,z:-4.4,w:1.4,d:1.5,h:1.1,c:i==1?'#F6C9D6':'#FBE3EA',edge:1}));it.push(box({x,z:-4.4,w:1.6,d:1.7,h:.22,y0:1.1,c:'#C2264B'}))});
 it.push(box({x:-8.6,z:1.5,w:.45,d:.45,h:1.8,c:'#4B2477'}));it.push(box({x:-8.6,z:3.7,w:.45,d:.45,h:1.8,c:'#4B2477'}));it.push(box({x:-8.6,z:2.6,w:.4,d:2.6,h:.35,y0:1.8,c:'#B02A86'}));
 [[-7,5],[-6,-4],[-1,-4.8],[6,3],[8,1],[-9,-3],[9,4.5],[0,4.2]].forEach(t=>{it.push({depth:P(t[0],0,t[1])[2],draw(){const b=P(t[0],0,t[1]),h=P(t[0],1.9,t[1]);cx.fillStyle='#8A6A4A';cx.fillRect(b[0]-2,b[1]-S*.5,4,S*.5);[[0,1],[.45,.78],[.9,.55]].forEach(([dy,k])=>{cx.beginPath();cx.ellipse(b[0],b[1]-S*(.7+dy*1.1),S*(.62-dy*.28),S*.42,0,0,6.28);cx.fillStyle=sh('#5FA66B',1.05-dy*.12);cx.fill()})}})});
 return it}
const SC=scene();
let cur=0,T0=0,prog=0,doneAt=null;
function pos(p){const i=Math.min(Math.floor(p),PATH.length-2),f=p-i;return [PATH[i][0]+(PATH[i+1][0]-PATH[i][0])*f,PATH[i][1]+(PATH[i+1][1]-PATH[i][1])*f]}
function timeline(t){ // วินาที → ตำแหน่งบนเส้นทาง, สถานีล่าสุดที่ถึง
 let p=0,st=-1,tt=t;const mv=1.5,dw=1.1;
 for(let k=0;k<4;k++){const a=SPT[k-1]??0,b=SPT[k];if(k>0){if(tt<mv){p=a+(b-a)*(tt/mv);return {p,st:k-1,moving:true}}tt-=mv}else{ }
  if(tt<dw){return {p:b,st:k,moving:false}}tt-=dw}return {p:SPT[3],st:3,moving:false,end:true}}
function figs(g,tl,el){const out=[];const [x,z]=pos(tl.p);const sx=[[0,0],[.5,.3],[-.4,.35],[.3,-.45],[-.5,-.3]];
 for(let i=0;i<g.people;i++){const o=sx[i],bob=tl.moving?Math.abs(Math.sin(el*9+i))*.12:Math.sin(el*2+i)*.03,kid=g.n.includes('ครอบครัว')&&i>=3;const px=x+o[0],pz=z+o[1];
  out.push({depth:P(px,0,pz)[2]+.2,draw(){const b=P(px,bob,pz),h=kid?.8:1.1;cx.fillStyle='#0002';cx.beginPath();cx.ellipse(b[0],b[1]+3,S*.28,S*.14,0,0,6.28);cx.fill();
   cx.fillStyle=sh(g.c,.92);cx.beginPath();cx.roundRect?cx.roundRect(b[0]-S*.2,b[1]-S*h,S*.4,S*h,S*.15):cx.rect(b[0]-S*.2,b[1]-S*h,S*.4,S*h);cx.fill();
   cx.fillStyle='#FBE0CC';cx.beginPath();cx.arc(b[0],b[1]-S*h-S*.2,S*.2,0,6.28);cx.fill()}})}return out}
const STP=[[-8,2.6],[-3.2,2.6],[2.2,-1.4],[6.6,-1.4]];
const lbs=[0,1,2,3].map(()=>{const d=document.createElement('div');d.className='lb';stage.appendChild(d);return d});
function ring(g,tl,el){if(!(tl.st>=g.care&&!(tl.st===g.care&&tl.moving)))return null;const c=STP[g.care];const k=(el*1.2)%1;
 return {depth:P(c[0],0,c[1])[2]-50,draw(){cx.strokeStyle=`rgba(194,38,75,${1-k})`;cx.lineWidth=3;cx.beginPath();for(let i=0;i<=40;i++){const a=i/40*6.28,q=P(c[0]+Math.cos(a)*(1+k*1.6),.2,c[1]+Math.sin(a)*(1+k*1.6));i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])}cx.stroke();
   cx.fillStyle='rgba(194,38,75,.18)';cx.beginPath();for(let i=0;i<=40;i++){const a=i/40*6.28,q=P(c[0]+Math.cos(a)*1,.2,c[1]+Math.sin(a)*1);i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])}cx.fill()}}}
let raf;function loop(ts){if(!T0)T0=ts;const el=(ts-T0)/1000;az+=(azT-az)*.12;if(!drag)azT+=0;
 cx.clearRect(0,0,W,H);const g=G[cur],tl=timeline(el);const items=[...SC,...figs(g,tl,el)];const r=ring(g,tl,el);if(r)items.push(r);
 items.sort((a,b)=>a.depth-b.depth).forEach(i=>i.draw());
 STP.forEach((s,i)=>{const q=P(s[0],2.6,s[1]);const l=lbs[i];l.style.left=q[0]+'px';l.style.top=q[1]+'px';
  l.innerHTML=`<b>${g.steps[i][0]}</b><span>${g.steps[i][1]}</span><em>ควรดูแล</em>`;l.classList.toggle('now',tl.st===i&&!tl.end);l.classList.toggle('off',i>tl.st);l.classList.toggle('care',i===g.care&&tl.st>=g.care&&!tl.moving)});
 const nt=document.getElementById('cnote');if(nt)nt.textContent=tl.end?g.note:'กำลังเล่น…';
 raf=requestAnimationFrame(loop)}
/* ---------- UI ---------- */
function setG(i){cur=i;T0=0;document.querySelectorAll('#tabs .btn').forEach((b,j)=>b.classList.toggle('on',j===i));
 const g=G[i];document.getElementById('panel').innerHTML=`<div class="ph"><span class="dot" style="background:${g.c}"></span><b>${g.n}</b><div class="sm"><b>${g.cnt} คน</b>${g.pct}% ของลูกค้าที่พักจริง</div></div>
 <div class="nums"><div><small>พักเฉลี่ย</small><b>${g.nights}</b></div><div><small>ยอดใช้จ่ายเฉลี่ย/ครั้ง</small><b>${g.spend}</b></div><div><small>กลับมาซ้ำ</small><b>${g.rep}</b></div><div><small>ความพึงพอใจ</small><b>${g.sat} / 5</b></div></div>
