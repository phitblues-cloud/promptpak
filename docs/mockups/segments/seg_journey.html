<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>กลุ่มลูกค้า — ป๊อบอัพเส้นทางลูกค้า (ร่างหยาบ)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EF;--ink:#2B1B3A;--mut:#7D7090;--line:#EADFEF;--pur:#4B2477}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 'Noto Sans Thai',sans-serif;padding:18px 14px 50px}.w{max-width:820px;margin:0 auto}
.tag{display:inline-block;background:#FFF1C7;color:#7A5A00;border-radius:99px;font-size:.75rem;padding:2px 12px;font-weight:600}
.sub{color:var(--mut);font-size:.84rem;margin:6px 0 12px}
.box{background:#fffdf9;border:1px solid var(--line);border-radius:22px;padding:18px}
.bt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bt h2{font:700 1.4rem 'Noto Serif Thai',serif;margin:0}
.pill{font-size:.7rem;font-weight:600;border-radius:99px;padding:1px 10px;background:#EFE3F7;color:#5B2A86}.pill.y{background:#FFF1C7;color:#7A5A00}
.pc{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;background:#fff;padding:12px 16px;margin-bottom:10px;cursor:pointer;font:inherit;color:inherit;transition:transform .2s,box-shadow .2s}
.pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px #4B247718}
.pc .r{display:flex;align-items:center;gap:10px}.pc b{font-size:1.05rem}.pc small{color:var(--mut);display:block}.pc .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.pc .pct{margin-left:auto;font:700 2rem 'Fraunces',serif}.pc .pct small{display:inline;font-size:.8rem;font-weight:400}
.tr{height:8px;border-radius:9px;background:#F1EAE0;margin-top:8px}.tr i{display:block;height:100%;border-radius:9px;background:var(--c)}
.foot{color:var(--mut);font-size:.75rem;margin-top:6px}
/* popup */
.ov{position:fixed;inset:0;background:#2B1B3A88;display:none;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}.ov.on{display:flex}
.pop{background:#fff;border-radius:24px;width:100%;max-width:760px;max-height:94vh;overflow:auto;padding:18px 20px 22px;animation:up .35s ease;position:relative}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.x{position:absolute;right:14px;top:12px;border:1.5px solid #D9CBE6;background:#fff;border-radius:99px;width:34px;height:34px;font-size:1.1rem;cursor:pointer;color:var(--pur)}
.ph{display:flex;align-items:center;gap:10px;padding-right:40px}.ph .dot{width:14px;height:14px;border-radius:50%}.ph h3{font:700 1.3rem 'Noto Serif Thai',serif;margin:0}.ph small{color:var(--mut)}
.stagewrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);margin:12px 0 6px;position:relative}
svg{display:block;width:100%;height:auto}
.cap{position:absolute;left:12px;top:10px;background:#fffffff0;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.85rem;box-shadow:0 3px 10px #4B247722}
.dots{display:flex;justify-content:space-between;gap:4px;margin:6px 4px 12px}.dots span{flex:1;text-align:center;font-size:.72rem;color:var(--mut);border-top:4px solid #EFE8F3;padding-top:3px;transition:all .4s}.dots span.on{color:var(--ink);font-weight:700;border-color:var(--c)}
.replay{border:1.5px solid #D9CBE6;background:#fff;border-radius:99px;padding:4px 14px;font:600 .8rem 'Noto Sans Thai';color:var(--pur);cursor:pointer;float:right;margin-top:-4px}
.sec{margin-top:10px}.sec h4{margin:0 0 3px;font-size:.8rem;color:#B02A86}.sec ul{margin:0;padding-left:20px}
.me{background:linear-gradient(135deg,#FFF6F8,#F6F0FC);border-radius:14px;padding:10px 14px;font-size:.9rem}
</style></head><body><div class="w">
<span class="tag">ร่างหยาบ · ตัวเลขและข้อความสมมติ</span>
<p class="sub">กล่อง "กลุ่มลูกค้า" หน้าเดิม ไม่เปลี่ยนหน้าตา · <b>แตะการ์ดกลุ่มไหนก็ได้</b> จะเด้งป๊อบอัพเส้นทางของลูกค้ากลุ่มนั้น</p>
<div class="box"><div class="bt"><h2>กลุ่มลูกค้า</h2><span class="pill">AI แบ่งกลุ่มตามพฤติกรรม</span><span class="pill y">ข้อมูลจำลอง</span></div>
 <div id="cards"></div><p class="foot">จากลูกค้า 27 คนในช่วงนี้ · แตะการ์ดเพื่อดูรายละเอียด</p></div></div>
<div class="ov" id="ov"><div class="pop" id="pop"></div></div>
<script>
const G=[
 {id:'B',n:'ลูกค้าบริษัท',one:'มาเป็นทีม · บริษัทจ่าย',c:'#6A3AA2',pct:33,val:['ใบกำกับภาษีถูกต้อง เบิกได้','ห้องทั้งทีมอยู่โซนเดียวกัน','Wi-Fi แรง ที่จอดรถกระบะ'],serve:['คุยกับหัวหน้าทีมผ่าน LINE ก่อนฤดูซ่อมบำรุง','ล็อกห้องทั้งทีมไว้โซนเดียวกัน','ออกใบกำกับภาษีให้ถูกต้องทุกครั้ง'],
  cap:['ทีมขับรถกระบะมาถึง','เช็คอินทั้งทีมที่เคาน์เตอร์','พักห้องโซนเดียวกัน','อาหารเช้าพร้อมกันทั้งทีม','เช็คเอาท์ รับใบกำกับภาษี']},
 {id:'W3',n:'ช่างจ่ายเอง',one:'มาคนเดียว · จ่ายเอง',c:'#B8862A',pct:56,val:['ราคาถูกและชัดเจน','จ่ายง่าย ยืดวันพักได้','ที่จอดรถ'],serve:['บอกราคาชัดตั้งแต่ต้น','ลดราคาเมื่อพักครบ 5 คืน','ชวนเพิ่มเพื่อน LINE'],
  cap:['ช่างขับมอเตอร์ไซค์/กระบะมาถึง','เช็คอิน จ่ายเอง','พักผ่อนหลังเลิกงาน','อาหารเช้าก่อนออกไปทำงาน','เช็คเอาท์ ออกไปทำงาน']},
 {id:'L',n:'ลูกค้าทั่วไป',one:'มาวันหยุด · พักผ่อน',c:'#D9598A',pct:11,val:['วิวเขื่อน บรรยากาศ','อาหารอร่อย','ห้องสำหรับครอบครัว'],serve:['ลงรูปสวยใน Google และ Facebook','ทำโปรวันหยุดเติมห้องว่าง','เน้นวิวเขื่อนและอาหาร'],
  cap:['ครอบครัวมาถึง','เช็คอิน ได้ห้องวิวเขื่อน','พักผ่อนสบายๆ','อาหารเช้าพร้อมหน้า','เช็คเอาท์ ขับรถกลับ']}];
document.getElementById('cards').innerHTML=G.map((g,i)=>`<button class="pc" style="--c:${g.c}" data-i="${i}"><div class="r"><span class="dot"></span><div><b>${g.n}</b><small>${g.one}</small></div><div class="pct">${g.pct}<small>% ของลูกค้า</small></div></div><div class="tr"><i style="width:${g.pct}%"></i></div></button>`).join('');
/* ---------- ฉากเส้นทาง (SVG 2 มิติ) ---------- */
const VW=900,VH=300;
function person(c,kind,sc=1){ // ตัวละคร · ฐานเท้าอยู่ y=0
 const skin='#F2C9A5',dk='#2B1B3A';let s='';
 if(kind==='B'){s+=`<g><ellipse cx="0" cy="2" rx="14" ry="4" fill="#0002"/><rect x="-11" y="-44" width="22" height="30" rx="8" fill="${c}"/><rect x="-3" y="-42" width="6" height="14" rx="2" fill="#fff"/><rect x="-5" y="-30" width="10" height="7" rx="2" fill="#FFD66B"/><rect x="-9" y="-16" width="7" height="16" rx="3" fill="${dk}"/><rect x="2" y="-16" width="7" height="16" rx="3" fill="${dk}"/><circle cx="0" cy="-54" r="10" fill="${skin}"/><path d="M-10 -56a10 10 0 0 1 20 0z" fill="${dk}"/><rect x="9" y="-28" width="14" height="10" rx="2" fill="#4B2477"/></g>`}
 if(kind==='W3'){s+=`<g><ellipse cx="0" cy="2" rx="14" ry="4" fill="#0002"/><rect x="-11" y="-44" width="22" height="30" rx="8" fill="${c}"/><rect x="-9" y="-16" width="7" height="16" rx="3" fill="#5C4A2A"/><rect x="2" y="-16" width="7" height="16" rx="3" fill="#5C4A2A"/><circle cx="0" cy="-54" r="10" fill="${skin}"/><path d="M-12 -56a12 11 0 0 1 24 0z" fill="#FFC21A"/><rect x="-13" y="-57" width="26" height="4" rx="2" fill="#E5A400"/><rect x="9" y="-24" width="16" height="12" rx="2" fill="#B33"/><rect x="13" y="-27" width="8" height="4" rx="2" fill="#555"/></g>`}
 if(kind==='L'){s+=`<g><ellipse cx="0" cy="2" rx="14" ry="4" fill="#0002"/><rect x="-11" y="-44" width="22" height="30" rx="8" fill="${c}"/><rect x="-9" y="-16" width="7" height="16" rx="3" fill="#3C5A8A"/><rect x="2" y="-16" width="7" height="16" rx="3" fill="#3C5A8A"/><circle cx="0" cy="-54" r="10" fill="${skin}"/><ellipse cx="0" cy="-60" rx="17" ry="4" fill="#E8B04B"/><path d="M-9 -60a9 8 0 0 1 18 0z" fill="#E8B04B"/><rect x="-16" y="-40" width="8" height="18" rx="3" fill="#7A5CC0"/>
  <g transform="translate(24,0) scale(.7)"><ellipse cx="0" cy="2" rx="12" ry="4" fill="#0002"/><rect x="-10" y="-40" width="20" height="26" rx="7" fill="#F7B5CB"/><rect x="-8" y="-16" width="6" height="16" rx="3" fill="#3C5A8A"/><rect x="2" y="-16" width="6" height="16" rx="3" fill="#3C5A8A"/><circle cx="0" cy="-50" r="10" fill="${skin}"/></g></g>`}
 return `<g transform="scale(${sc})">${s}</g>`}
function car(c,kind){const body=kind==='W3'?`<rect x="-42" y="-30" width="70" height="20" rx="6" fill="${c}"/><rect x="-10" y="-46" width="36" height="18" rx="6" fill="${c}"/><rect x="-4" y="-42" width="26" height="12" rx="3" fill="#CFE6F5"/><rect x="-60" y="-24" width="22" height="14" rx="2" fill="#9A8466"/>`:
  `<rect x="-50" y="-30" width="100" height="22" rx="8" fill="${c}"/><rect x="-26" y="-48" width="54" height="22" rx="9" fill="${c}"/><rect x="-20" y="-44" width="18" height="14" rx="3" fill="#CFE6F5"/><rect x="2" y="-44" width="22" height="14" rx="3" fill="#CFE6F5"/>`;
 return `<ellipse cx="0" cy="2" rx="52" ry="6" fill="#0002"/>${body}<circle cx="-28" cy="-8" r="9" fill="#2B1B3A"/><circle cx="28" cy="-8" r="9" fill="#2B1B3A"/><circle cx="-28" cy="-8" r="3" fill="#ccc"/><circle cx="28" cy="-8" r="3" fill="#ccc"/>`}
function bg(){return `
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="s1" offset="0" stop-color="#FFE9C9"/><stop id="s2" offset="1" stop-color="#FDF3E3"/></linearGradient></defs>
 <rect width="${VW}" height="${VH}" fill="url(#sky)"/>
 <circle id="sun" cx="840" cy="50" r="22" fill="#FFC857"/><g id="moon" opacity="0"><circle cx="560" cy="48" r="20" fill="#FFF6D6"/><circle cx="570" cy="42" r="18" fill="#2C2150"/></g>
 <g id="stars" opacity="0" fill="#FFF">${[[470,30],[520,70],[620,40],[660,80],[700,34]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2"/>`).join('')}</g>
 <rect y="232" width="${VW}" height="68" fill="#CFE3C2"/><rect y="236" width="${VW}" height="40" fill="#8E8A9A"/><g stroke="#fff" stroke-width="3" stroke-dasharray="26 22"><line x1="0" y1="256" x2="${VW}" y2="256"/></g>
 <!-- โรงแรม -->
 <g transform="translate(200,0)"><rect x="0" y="92" width="150" height="140" rx="6" fill="#8B3FA8"/><rect x="-8" y="82" width="166" height="16" rx="4" fill="#4B2477"/>${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${14+c*44}" y="${112+r*38}" width="28" height="24" rx="3" fill="#FFE9A8"/>`).join('')).join('')}<rect x="56" y="188" width="38" height="44" rx="4" fill="#4B2477"/><text x="75" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#4B2477" font-family="Noto Sans Thai">พบรักรีสอร์ท</text></g>
 <!-- เตียง -->
 <g transform="translate(430,0)"><rect x="0" y="170" width="150" height="62" rx="8" fill="#FFF" stroke="#E3D8EC"/><rect x="0" y="146" width="12" height="86" rx="4" fill="#6B4A2A"/><rect x="12" y="188" width="130" height="30" rx="8" fill="#E6D3F2"/><rect x="18" y="172" width="38" height="18" rx="8" fill="#fff" stroke="#E3D8EC"/><rect x="60" y="186" width="82" height="26" rx="8" fill="#B02A86" opacity=".85"/></g>
 <!-- โต๊ะอาหารเช้า -->
 <g transform="translate(640,0)"><rect x="0" y="196" width="120" height="10" rx="4" fill="#B98A5A"/><rect x="14" y="206" width="8" height="26" fill="#8C6840"/><rect x="98" y="206" width="8" height="26" fill="#8C6840"/>
  <ellipse cx="30" cy="192" rx="18" ry="5" fill="#fff" stroke="#E3D8EC"/><ellipse cx="30" cy="188" rx="8" ry="4" fill="#FFC857"/><ellipse cx="86" cy="192" rx="18" ry="5" fill="#fff" stroke="#E3D8EC"/><path d="M80 184q6-8 12 0z" fill="#E0762F"/><rect x="52" y="176" width="14" height="18" rx="3" fill="#E0762F"/><path d="M56 170q-3-8 2-12M62 170q-3-8 2-12" stroke="#B9AEC9" fill="none" stroke-width="2"/></g>`}
const ST=[[110,'ถึง'],[270,'เช็คอิน'],[500,'เข้าพัก'],[700,'อาหารเช้า'],[840,'เช็คเอาท์']];
let T0=0,cur=null,raf;
function open(i){cur=G[i];const g=cur;document.getElementById('pop').style.setProperty('--c',g.c);
 document.getElementById('pop').innerHTML=`<button class="x" id="cl" aria-label="ปิด">✕</button><div class="ph"><span class="dot" style="background:${g.c}"></span><div><h3>${g.n}</h3><small>${g.one} · ${g.pct}% ของลูกค้า</small></div></div>
 <div class="stagewrap"><svg id="sv" viewBox="0 0 ${VW} ${VH}">${bg()}<g id="dyn"></g></svg><div class="cap" id="cap">${g.cap[0]}</div></div>
 <button class="replay" id="rp">▶ เล่นอีกครั้ง</button><div class="dots" id="dots">${g.cap.map((c,k)=>`<span>${['ถึง','เช็คอิน','เข้าพัก','อาหารเช้า','เช็คเอาท์'][k]}</span>`).join('')}</div>
 <div class="sec"><h4>ความต้องการของเขา</h4><ul>${g.val.map(v=>`<li>${v}</li>`).join('')}</ul></div>
 <div class="sec"><h4>วิธีดูแลที่ควรทำ</h4><ul>${g.serve.map(v=>`<li>${v}</li>`).join('')}</ul></div>`;
 document.getElementById('ov').classList.add('on');document.getElementById('cl').onclick=close;document.getElementById('rp').onclick=()=>{T0=0};T0=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function close(){document.getElementById('ov').classList.remove('on');cancelAnimationFrame(raf)}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close()};
document.getElementById('cards').onclick=e=>{const b=e.target.closest('.pc');if(b)open(+b.dataset.i)};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
function loop(ts){if(!T0)T0=ts;const t=(ts-T0)/1000,g=cur,kind=g.id,c=g.c;
 // เส้นเวลา 0-12 วินาที
 let carA=-80,ch=null,carB=null,stage=0,night=0,morning=0;
 if(t<2){carA=lerp(-80,120,ease(t/2));stage=0}else{carA=120}
 const carY=258;let chx=0,walk=false;
 if(t>=2&&t<3){chx=150;ch=1;stage=0}                       // ลงจากรถ
 if(t>=3&&t<4.6){chx=lerp(150,275,ease((t-3)/1.6));walk=true;stage=1}
 if(t>=4.6&&t<5.4){chx=275;stage=1}
 if(t>=5.4&&t<7){chx=lerp(275,500,ease((t-5.4)/1.6));walk=true;stage=2;night=Math.min(1,(t-5.4)/1.2)}
 if(t>=7&&t<8){chx=500;stage=2;night=1}
 if(t>=8&&t<9.6){chx=lerp(500,700,ease((t-8)/1.6));walk=true;stage=3;night=1-Math.min(1,(t-8)/1.0);morning=1}
 if(t>=9.6&&t<10.8){chx=700;stage=3;morning=1}
 if(t>=10.8&&t<12){chx=lerp(700,830,ease((t-10.8)/1.2));walk=true;stage=4;morning=1}
 let carBx=null,vis=true;
 if(t<10.8)carBx=null;else if(t<12){carBx=836}else{carBx=836+(t-12)*250;vis=false}
 if(t>=12){stage=4}
 const sc=(t<12?1:1);
 const bob=walk?Math.abs(Math.sin(t*10))*3:0;
 const people=[];const n=kind==='B'?3:1;
 const cars=`<g transform="translate(${carA},${carY})">${car(c,kind)}</g>${carBx!=null?`<g transform="translate(${carBx},${carY})">${car(c,kind)}</g>`:''}`;
 let ppl='';if(t>=2&&t<12){for(let k=0;k<n;k++)ppl+=`<g transform="translate(${chx-k*26},${232-bob*(k%2?.6:1)})">${person(c,kind,.95)}</g>`}
 document.getElementById('dyn').innerHTML=cars+ppl;
 // ท้องฟ้า
 const s1=night>0?`rgb(${255-night*205|0},${233-night*180|0},${201-night*120|0})`:'#FFE9C9';document.getElementById('s1').setAttribute('stop-color',s1);
 document.getElementById('s2').setAttribute('stop-color',night>0?`rgb(${253-night*190|0},${243-night*190|0},${227-night*130|0})`:'#FDF3E3');
 document.getElementById('moon').setAttribute('opacity',night);document.getElementById('stars').setAttribute('opacity',night);document.getElementById('sun').setAttribute('opacity',1-night);
 document.getElementById('cap').textContent=g.cap[Math.min(4,stage)];
 document.querySelectorAll('#dots span').forEach((s,k)=>s.classList.toggle('on',k<=stage));
 if(t<14.5)raf=requestAnimationFrame(loop)}
</script></body></html>
