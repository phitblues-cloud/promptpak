<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login v3 — พบรักรีสอร์ท</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;600&family=Noto+Sans+Thai:wght@900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B0F45;--cream:#FFF9E3;--yel:#FFD66B;--pink:#F29AC1;--hot:#C2287F;--org:#F2A65A;--grn:#7BC47F;--disp:'Noto Sans Thai','Chakra Petch',sans-serif;--lab:'Chakra Petch','IBM Plex Sans Thai',sans-serif;--body:'IBM Plex Sans Thai',sans-serif;--cyc:26s}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);overflow:hidden;background:#8A66B8}
.stage{position:relative;height:100vh;height:100dvh;overflow:hidden;animation:bg var(--cyc) linear infinite}
@keyframes bg{0%,30%{background:#8A66B8}48%{background:#B0568F}62%,86%{background:#3B2068}100%{background:#8A66B8}}
/* ===== เลเยอร์หลัง: ชื่อโรงแรมวิ่ง ===== */
.row{position:absolute;left:0;width:100%;overflow:hidden;white-space:nowrap;pointer-events:none}
.row.r1{top:-3vh;height:42vh}.row.r2{bottom:19vh;height:20vh}
.trk{display:inline-flex;will-change:transform}
.r1 .trk{animation:mqL 42s linear infinite}.r2 .trk{animation:mqR 55s linear infinite}
@keyframes mqL{to{transform:translateX(-33.3333%)}}@keyframes mqR{from{transform:translateX(-33.3333%)}to{transform:none}}
.cp{display:inline-flex;font:900 38vh/1.25 var(--disp);color:var(--ink);padding-right:.45em;animation:txc var(--cyc) linear infinite}
.r2 .cp{font-size:17vh;line-height:1.2;opacity:.55;padding-right:.6em}
@keyframes txc{0%,30%{color:#2B0F45}48%{color:#4A0F3A}62%,86%{color:#B9A0F0}100%{color:#2B0F45}}
.g{display:inline-block;transform:translateY(-135%)}
.g.in{animation:gin .75s cubic-bezier(.2,1.25,.36,1) both,hop 8s ease-in-out 2s infinite;animation-delay:calc(var(--i)*60ms),calc(var(--i)*150ms + 2s)}
.g.out{animation:gout .34s cubic-bezier(.5,0,.75,.3) both;animation-delay:calc(var(--i)*22ms)}
@keyframes gin{from{transform:translateY(-135%)}to{transform:none}}
@keyframes gout{from{transform:none}to{transform:translateY(135%)}}
@keyframes hop{0%,90%,100%{transform:none}94%{transform:translateY(-6%) rotate(-2deg)}98%{transform:translateY(1.5%)}}
/* ===== สติกเกอร์ทั้งหมด ===== */
.sk{position:absolute;filter:drop-shadow(0 6px 0 rgba(43,15,69,.28))}
svg{overflow:visible}
.st{stroke:var(--ink);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.sun{left:5%;top:15vh;width:max(110px,13vh);animation:spin 24s linear infinite}
.moon{right:6%;top:16vh;width:max(90px,11vh);animation:bob 5s ease-in-out infinite;opacity:0;animation:moonv var(--cyc) linear infinite,bob 5s ease-in-out infinite}
@keyframes moonv{0%,52%{opacity:0}64%,86%{opacity:1}100%{opacity:0}}
.sun{animation:spin 24s linear infinite,sunv var(--cyc) linear infinite}
@keyframes sunv{0%,44%{opacity:1}56%,92%{opacity:0}100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.cl{animation:drift 60s linear infinite}.cl.c2{animation-duration:80s;animation-delay:-35s}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sp{animation:tw 2.6s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(.85) rotate(0)}50%{transform:scale(1.15) rotate(18deg)}}
.hotel{right:3%;bottom:11vh;height:68vh;max-height:560px}
.cot{left:2%;bottom:11vh;height:40vh;max-height:330px}
.w{fill:#C9A8E8;animation:win var(--cyc) linear infinite;animation-delay:var(--d)}
@keyframes win{0%,40%{fill:#C9A8E8}52%,90%{fill:var(--on)}100%{fill:#C9A8E8}}
.wel .w{animation:none;fill:var(--yel)}
.sign text{animation:neon 2.6s steps(1) infinite}@keyframes neon{0%,86%,100%{opacity:1}90%{opacity:.4}94%{opacity:1}97%{opacity:.5}}
.bell{transform-box:fill-box;transform-origin:50% 0;animation:ding 6s ease-in-out infinite}
@keyframes ding{0%,78%,100%{transform:none}82%{transform:rotate(16deg)}86%{transform:rotate(-13deg)}90%{transform:rotate(6deg)}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:rg 6s ease-out infinite}
@keyframes rg{0%,80%{opacity:0;transform:scale(.5)}82%{opacity:.9}100%{opacity:0;transform:scale(2.6)}}
/* เนินสโคลปด้านล่าง */
.hills{position:absolute;left:0;right:0;bottom:0;height:17vh;display:flex;overflow:hidden;z-index:4}
.hills i{flex:none;width:17vh;height:17vh;border-radius:50%;margin:3vh -2.4vh 0;border:5px solid var(--ink);background:var(--pink);animation:hh 5s ease-in-out infinite;animation-delay:calc(var(--k)*-.45s)}
.hills i:nth-child(3n){background:var(--grn)}.hills i:nth-child(3n+1){background:#F5B8D4}
@keyframes hh{50%{transform:translateY(-1.2vh)}}
.cart{position:absolute;bottom:9vh;left:0;height:17vh;z-index:5;animation:push 16s linear infinite;animation-delay:-4s}
@keyframes push{from{transform:translateX(-30vh)}to{transform:translateX(105vw)}}
.bh{animation:bobb .5s ease-in-out infinite alternate}@keyframes bobb{to{transform:translateY(-4px)}}
.key{left:calc(50% - min(46vw,235px) - 150px);top:-6px;transform-origin:50% 0;animation:swg 4.6s ease-in-out infinite;z-index:7;height:25vh}
@keyframes swg{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-11deg)}}
.chip{position:absolute;z-index:9;font:700 .85rem var(--lab);letter-spacing:.1em;color:var(--ink);background:var(--yel);border:3px solid var(--ink);border-radius:99px;padding:.45rem 1.1rem;transform:rotate(-6deg);box-shadow:3px 4px 0 var(--ink)}
.chip.a{left:2.2%;top:2.2vh}.chip.b{right:2.2%;top:2.2vh;background:var(--pink);transform:rotate(5deg)}
/* ===== การ์ดล็อกอิน ===== */
.card{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(92vw,470px);z-index:6;border-radius:30px;background:var(--cream);box-shadow:0 14px 0 rgba(43,15,69,.3);overflow:visible;animation:pop .8s cubic-bezier(.2,1.3,.4,1) .3s both}
@keyframes pop{from{transform:translate(-50%,-34%) scale(.8);opacity:0}}
.top{border-radius:30px 30px 0 0;height:min(22vh,190px);background:radial-gradient(circle at 18% 20%,#FF8FC1 0,transparent 45%),radial-gradient(circle at 85% 80%,#FFB36B 0,transparent 40%),linear-gradient(135deg,#6A3AA2,#C2287F);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 1.4rem;position:relative}
.top h2{margin:0;font:900 clamp(2rem,6.2vh,3.1rem)/1.12 var(--disp);color:#fff;text-shadow:3px 3px 0 var(--ink);position:relative;z-index:2}
.top h2 small{display:block;font:700 .95rem var(--lab);letter-spacing:.2em;color:var(--yel);text-shadow:none;margin-top:.5rem}
.top svg.dec{position:absolute}
.bot{padding:1.1rem 1.5rem 1.6rem;display:flex;flex-direction:column;gap:.8rem}
.bot p{margin:0;text-align:center;font:400 .9rem/1.5 var(--body)}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.ac{background:#F3EBC4;border:3px solid var(--ink);border-radius:18px;padding:.55rem .6rem;text-align:left;font:600 .88rem var(--body);color:var(--ink);cursor:pointer;display:flex;gap:.5rem;align-items:center;transition:.15s}
.ac b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--body);flex:none;color:#fff;background:var(--hot)}
.ac.s b{background:var(--ink)}.ac small{display:block;font:400 .68rem var(--body);opacity:.7}
.ac.on{background:var(--yel);transform:translate(-2px,-3px);box-shadow:3px 4px 0 var(--ink)}
.ac:hover{transform:translate(-2px,-3px)}
.line{display:flex;align-items:center;gap:.7rem}
.pin{flex:1;min-width:0;background:#F3EBC4;border:3px solid var(--ink);border-radius:99px;font:700 1.2rem var(--lab);letter-spacing:.5em;text-align:center;padding:.7rem 1rem;color:var(--ink);outline:0}
.pin::placeholder{letter-spacing:.35em;color:#9a8aa8}
.go{flex:none;width:96px;height:80px;border:0;background:none;cursor:pointer;position:relative;padding:0;transition:.15s}
.go svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
.go span{position:relative;font:700 .95rem var(--lab);color:var(--yel);letter-spacing:.08em}
.go:hover{transform:scale(1.1) rotate(-4deg)}
.x{position:absolute;right:-14px;top:-14px;width:46px;height:46px;z-index:8;cursor:pointer;border:0;background:none;padding:0}
.x svg{width:100%;height:100%}
.ok{display:none;text-align:center;padding:.6rem 0 .2rem}.ok b{display:block;font:900 1.7rem var(--disp);color:var(--hot)}.ok span{font-size:.85rem;opacity:.8}
.ok a{display:inline-block;margin-top:.7rem;font:700 .85rem var(--lab);letter-spacing:.1em;color:var(--ink)}
.card.done .bot>:not(.ok){display:none}.card.done .ok{display:block}
.badge{position:absolute;left:-52px;top:-34px;width:118px;z-index:8;transform:rotate(-12deg);animation:bd 4s ease-in-out infinite}
@keyframes bd{50%{transform:rotate(-4deg) scale(1.06)}}
.bigstar{position:absolute;right:-70px;top:44%;width:112px;z-index:8;animation:tw 3s ease-in-out infinite}
.mockbar{position:fixed;left:50%;bottom:.45rem;transform:translateX(-50%);z-index:20;background:#FFF1C7;color:#7A5A00;border:2px solid var(--ink);border-radius:99px;font:600 .72rem var(--body);padding:2px 14px;white-space:nowrap}
.conf{position:absolute;z-index:10;pointer-events:none;width:44px;opacity:0}
.wel .conf{animation:cf 1.6s ease-out both;animation-delay:var(--d)}
@keyframes cf{0%{opacity:0;transform:translate(0,0) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.3) rotate(120deg)}}
@media (max-width:760px){.hotel{height:46vh;right:-12%}.cot{display:none}.badge{left:-14px;top:-40px;width:92px}.bigstar{right:-24px;width:80px}.key{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.g{transform:none!important}}
</style></head><body>

 <svg class="sk cl" style="top:30vh;left:0;width:150px" viewBox="-80 -40 160 80"><path class="st" fill="#fff" d="M-60 20a22 22 0 0 1 8-42a30 30 0 0 1 56-6a24 24 0 0 1 48 10a18 18 0 0 1-6 38z"/></svg>

 <svg class="sk sp" style="left:30%;top:46vh;width:42px" viewBox="-1.2 -1.2 2.4 2.4"><use href="#star4" fill="#FFD66B" stroke="#2B0F45" stroke-width=".12"/></svg>

 <!-- ตึกโรงแรม (สติกเกอร์ใหญ่ หลุดขอบ) -->

  <rect class="st" x="48" y="200" width="46" height="46" rx="6" fill="#FFE9A8"/><path class="st" d="M120 320v-70a24 24 0 0 1 48 0v70z" fill="#2B0F45"/>
 </svg>

 <!-- ป้ายกุญแจห้อง 101 ห้อยจากขอบบน -->
 <svg class="sk key" viewBox="-30 0 60 200"><line x1="0" y1="0" x2="0" y2="80" stroke="#2B0F45" stroke-width="5"/><g transform="translate(0 80)"><rect class="st" x="-26" y="0" width="52" height="64" rx="14" fill="#fff"/><text x="0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#6A3AA2" font-family="Chakra Petch,sans-serif">101</text><g transform="translate(0 76)"><circle class="st" r="11" fill="none" stroke-width="7" style="stroke:#E0A82E"/><path class="st" d="M0 12V50M0 38h12M0 48h9" style="stroke:#E0A82E;stroke-width:7;fill:none"/></g></g></svg>

  <rect class="st" x="40" y="-70" width="120" height="8" rx="4" fill="#E0A82E"/><rect class="st" x="148" y="-130" width="8" height="68" fill="#E0A82E"/><rect class="st" x="40" y="-130" width="116" height="8" fill="#E0A82E"/>
  <rect class="st" x="54" y="-124" width="44" height="52" rx="6" fill="#6A3AA2"/><rect class="st" x="104" y="-102" width="40" height="30" rx="6" fill="#F2A65A"/>

 </svg>

 <!-- การ์ดล็อกอิน -->
 <form class="card" id="card" onsubmit="return false">

  <svg class="bigstar sk" viewBox="-1.2 -1.2 2.4 2.4"><use href="#star4" fill="#FFD66B" stroke="#2B0F45" stroke-width=".07"/></svg>

  <div class="top">

<script>
const NS='http://www.w3.org/2000/svg';
function flower(id,n,R,r,fill){const g=document.getElementById(id);let h='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2;h+=`<circle cx="${(Math.cos(a)*R).toFixed(1)}" cy="${(Math.sin(a)*R).toFixed(1)}" r="${r}" fill="${fill}" stroke="#2B0F45" stroke-width="5"/>`}
 h+=`<circle r="${R+2}" fill="${fill}"/>`;g.innerHTML=h}
flower('sunf',10,36,16,'#FFD66B');document.getElementById('sunf').insertAdjacentHTML('beforeend','<circle r="30" fill="#FFB347" stroke="#2B0F45" stroke-width="5"/><circle cx="-10" cy="-4" r="3" fill="#2B0F45"/><circle cx="10" cy="-4" r="3" fill="#2B0F45"/><path d="M-9 8q9 8 18 0" stroke="#2B0F45" stroke-width="3.5" fill="none" stroke-linecap="round"/>');
flower('bflower',8,34,20,'#F2A65A');flower('xflower',7,26,14,'#2B0F45');flower('gflower',8,34,19,'#2B0F45');
// หน้าต่าง
(function(){let h='',s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;for(let y=0;y<6;y++)for(let x=0;x<5;x++){h+=`<rect class="w st" style="stroke-width:4;--d:${(r()*4).toFixed(2)}s;--on:${r()>.35?'#FFD66B':'#C9A8E8'}" x="${34+x*60}" y="${160+y*56}" width="40" height="36" rx="8"/>`}document.getElementById('wins').innerHTML=h})();
// เนิน
(function(){let h='';for(let i=0;i<22;i++)h+=`<i style="--k:${i}"></i>`;document.getElementById('hills').innerHTML=h})();
// confetti
(function(){let h='';const c=['#FFD66B','#fff','#F29AC1','#7BC47F'];for(let i=0;i<14;i++){const a=i/14*Math.PI*2,d=160+Math.random()*180;h+=`<svg class="conf" style="left:50%;top:50%;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--d:${(i%5)*.06}s" viewBox="-1.2 -1.2 2.4 2.4"><use href="#star4" fill="${c[i%4]}" stroke="#2B0F45" stroke-width=".1"/></svg>`}document.getElementById('confs').innerHTML=h})();
// ชื่อโรงแรมวิ่ง
const seg=t=>{try{return [...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(t)].map(x=>x.segment)}catch(e){return [...t]}};
function fill(el,text,sep){let h='';for(let c=0;c<3;c++){let i=0;h+='<div class="cp" aria-hidden="true">'+seg(text).map(g=>`<span class="g in" style="--i:${i++}">${g===' '?'&nbsp;':g}</span>`).join('')+`<span class="g in" style="--i:${i++}">${sep}</span></div>`}el.innerHTML=h}
const T1=document.getElementById('t1'),T2=document.getElementById('t2'),ST=document.getElementById('stage');
function build(a,b){fill(T1,a,'&nbsp;✦&nbsp;');fill(T2,b,'&nbsp;·&nbsp;')}
function swap(a,b){document.querySelectorAll('.g').forEach(g=>{g.classList.remove('in');g.classList.add('out')});setTimeout(()=>build(a,b),700)}
build('พบรักรีสอร์ท','พบรักรีสอร์ท · ห้องพัก อาหารเช้า บริการซักรีด');
let sel=null;const card=document.getElementById('card'),$=id=>document.getElementById(id);
document.querySelectorAll('.ac').forEach(b=>b.onclick=()=>{sel=b.dataset.k;document.querySelectorAll('.ac').forEach(x=>x.classList.toggle('on',x===b));$('pin').focus()});
$('go').onclick=()=>{if(!sel){$('go').animate([{transform:'rotate(-14deg)'},{transform:'rotate(14deg)'},{transform:'none'}],{duration:300});return}
 card.classList.add('done');ST.classList.add('wel');$('hh').innerHTML='ยินดีต้อนรับ<small>'+(sel==='o'?'เจ้าของรีสอร์ท':'ทีมงานต้อนรับ')+'</small>';
 document.querySelectorAll('.conf').forEach(c=>{c.style.animation='none';c.offsetWidth;c.style.animation=''});
 swap('ยินดีต้อนรับ','พบรักรีสอร์ท · ขอให้เป็นวันที่ดี')};
function back(){card.classList.remove('done');ST.classList.remove('wel');$('hh').innerHTML='เข้าสู่ระบบ<small>พบรักรีสอร์ท</small>';$('pin').value='';swap('พบรักรีสอร์ท','พบรักรีสอร์ท · ห้องพัก อาหารเช้า บริการซักรีด')}
$('out').onclick=e=>{e.preventDefault();back()};$('xbtn').onclick=()=>{if(card.classList.contains('done'))back()};
</script></body></html>
