<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Prompt Pak PMS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: technical grid sheet. Top bar of cells, giant wordmark row, then login | illustration | info tile, and a strip of system modules. */
:root{
  --bg:#EDEDEE; --cell:#F6F6F7; --paper:#FFFFFF; --ink:#2B2B30; --soft:#6E6E76; --line:#D3D3D8;
  --purple:#6A3AA2; --pink:#C2287F; --pink-ink:#FFFFFF; --tile:#101010; --tile-fg:#F2F2F2;
  --w:#FFFFFF; --w2:#DADADF; --w3:#B8B8C0; --grad:linear-gradient(135deg,#6A3AA2 0%,#C2287F 100%); --ok:#1E8A55; --red:#C41E3A;
  --display:'Chakra Petch','IBM Plex Sans Thai',sans-serif; --body:'IBM Plex Sans Thai','Chakra Petch',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141415; --cell:#1B1B1D; --paper:#242427; --ink:#F2F2F4; --soft:#A2A2AA; --line:#3A3A3F;
  --purple:#A67BE0; --pink:#F060A8; --pink-ink:#1D1429; --w:#E8E8EB; --w2:#8E8E96; --w3:#5E5E66; --grad:linear-gradient(135deg,#A67BE0 0%,#F060A8 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141415; --cell:#1B1B1D; --paper:#242427; --ink:#F2F2F4; --soft:#A2A2AA; --line:#3A3A3F;
  --purple:#A67BE0; --pink:#F060A8; --pink-ink:#1D1429; --w:#E8E8EB; --w2:#8E8E96; --w3:#5E5E66; --grad:linear-gradient(135deg,#A67BE0 0%,#F060A8 100%); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.sheet{max-width:1400px;margin:0 auto;border-inline:1px solid var(--line);background:var(--cell);padding-block:0;
  margin-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px));}
@media (min-width:1432px){.sheet{margin-inline:auto}}
.row{display:grid;border-bottom:1px solid var(--line)}
.cellx{padding:1.1rem 1.4rem;border-right:1px solid var(--line);min-width:0}
.cellx:last-child{border-right:0}
/* top bar */
.top{grid-template-columns:minmax(0,1fr);align-items:stretch;background:var(--cell)}
.top .cellx{display:flex;align-items:center;gap:.8rem}
.mark{width:44px;height:44px;background:var(--grad);display:grid;place-items:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.mark i{width:22px;height:22px;background:var(--cell);display:block;border-radius:5px;position:relative}
.mark i::before,.mark i::after{content:"";position:absolute;top:8px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.mark i::before{left:5px}.mark i::after{right:5px}
.nm1{font:700 1.35rem/1 var(--display);letter-spacing:.01em}
.nm2{font:500 .72rem var(--display);letter-spacing:.14em;color:var(--soft);display:block;margin-top:.2rem}
.top .mid{font:500 .85rem var(--display);letter-spacing:.06em;color:var(--soft);justify-content:center}
.cut{font:600 .9rem var(--display);letter-spacing:.08em;background:var(--grad);color:var(--pink-ink);border:0;padding:.85rem 1.4rem;cursor:pointer;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));text-align:center}
.cut:hover{filter:brightness(1.07)}
.cut.dark{background:var(--ink);color:var(--cell)}
.cut.full{width:100%}
.cut:focus-visible,.lnk:focus-visible,input:focus-visible,.acc:focus-visible,.rm:focus-visible,.tg:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
/* wordmark */
.hero{position:relative;padding:1.2rem 1.6rem 1rem;overflow:hidden}
.sq{position:absolute;width:14px;height:14px;background:var(--grad)}
.sq.a{left:18px;top:18px}.sq.b{right:18px;top:18px}.sq.c{left:18px;bottom:18px}.sq.d{right:18px;bottom:18px}
.big{font:700 clamp(2.8rem,10vw,8rem)/1.1 var(--display);letter-spacing:.02em;line-height:1.35;margin:0;text-align:center;padding-block:1.4rem}
.tags{display:flex;gap:2rem;padding:0 1.2rem 0 1.6rem;font:500 .8rem var(--display);letter-spacing:.14em;color:var(--ink);padding-left:2.2rem}
.tags span{display:inline-flex;gap:.55rem;align-items:center}
/* main row */
.main{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.main .cellx{padding:0}
.main .cellx.login{padding:2rem 1.8rem 2rem}
.login h2{font:700 1.4rem/1.3 var(--display);margin:0 0 .2rem}
.sub{color:var(--soft);margin:0 0 1.2rem;font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acc{position:relative;background:var(--paper);border:1px solid var(--line);padding:1.2rem .8rem 1rem;text-align:center;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:.3rem;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:background .15s}
.acc:hover{background:var(--w2)}
.av{width:68px;height:68px;display:grid;place-items:center;font:700 28px var(--display);margin-bottom:.3rem;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.owner .av{background:var(--grad);color:var(--pink-ink)} .staff .av{background:var(--ink);color:var(--cell)}
.nm{font-weight:600}
.role{font:600 .72rem var(--display);letter-spacing:.1em;padding:.1rem .55rem;border:1px solid var(--ink)}
.last{font-size:.78rem;color:var(--soft)}
.rm{position:absolute;top:6px;right:14px;width:26px;height:26px;border:0;background:transparent;color:var(--soft);cursor:pointer;font-size:18px;line-height:26px}
.rm:hover{color:var(--ink);background:var(--line)}
.add{background:transparent;border-style:dashed;justify-content:center;color:var(--soft)}
.add .av{background:var(--line);color:var(--soft);font-size:32px}
.field{display:block;margin-bottom:.9rem}
.field span{display:block;font:500 .75rem var(--display);letter-spacing:.12em;color:var(--soft);margin-bottom:.25rem}
input[type=text],input[type=password]{width:100%;font:inherit;padding:.75rem .9rem;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0}
.pw{position:relative}.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink);font:600 .8rem var(--display);cursor:pointer;padding:.5rem;text-decoration:underline}
.chk{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;margin:.2rem 0 1.1rem}
.chk input{margin-top:.3rem;accent-color:var(--pink)}
.lnk{background:none;border:0;color:var(--ink);font:500 .88rem var(--body);cursor:pointer;padding:.4rem 0;text-decoration:underline;text-underline-offset:3px}
.rowb{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem;flex-wrap:wrap;gap:.3rem}
.err{color:var(--red);font-size:.85rem;margin:-.4rem 0 .8rem}
.note{margin-top:1.4rem;font-size:.8rem;color:var(--soft);border-top:1px solid var(--line);padding-top:.9rem}
.loading{text-align:center;padding:1rem 0}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:1.2rem auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tick{width:60px;height:60px;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 1rem;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
/* illustration */
.ill{background:var(--cell);display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:340px}
.ill svg{width:100%;height:auto;max-height:480px;display:block}
.ill .tagl{position:absolute;left:14px;top:12px;font:500 .72rem var(--display);letter-spacing:.14em;color:var(--soft)}
/* info tile */
.side{display:flex;flex-direction:column}
.tile{background:var(--tile);color:var(--tile-fg);margin:1.2rem;padding:1.2rem;position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:1rem;min-height:220px}
.tile::before,.tile::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--tile-fg);opacity:.7}
.tile::before{left:8px;top:8px;border-right:0;border-bottom:0}.tile::after{right:8px;bottom:8px;border-left:0;border-top:0}
.tile b{font:700 1.15rem/1.3 var(--display)}
.tile p{margin:0;font-size:.85rem;opacity:.8}
.tile .bar{display:flex;gap:4px}.tile .bar i{flex:1;height:6px;background:var(--grad)}.tile .bar i:nth-child(n+4){background:#444}
.dummy{display:flex;border-top:1px solid var(--line);font:500 .78rem var(--display);letter-spacing:.1em}
.tg span,.tg button{flex:1;padding:.9rem;text-align:center;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.tg button[aria-pressed=true]{background:var(--grad);color:var(--pink-ink)}
.tg span{cursor:default;color:var(--soft)}
/* modules strip */
.strip{grid-template-columns:repeat(6,minmax(0,1fr));background:var(--paper);border-bottom:0}
.strip div{padding:1.2rem 1rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.3rem;min-width:0}
.strip div:last-child{border-right:0}
.strip b{font:700 1.05rem var(--display)}
.strip small{color:var(--soft);font-size:.78rem;line-height:1.35}
.strip em{font:500 .68rem var(--display);font-style:normal;letter-spacing:.14em;color:var(--orange)}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.acc{transition:none}}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .main .cellx{border-right:0;border-bottom:1px solid var(--line)}
  .strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .strip div{border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .top{grid-template-columns:minmax(0,1fr) auto}.top .mid{display:none}
  .top .cellx{padding:.8rem 1rem}
  .cut{padding:.7rem 1rem;font-size:.8rem}
  .tags{gap:1rem;flex-wrap:wrap;padding-left:1.4rem;padding-bottom:.6rem}
  .login{padding:1.2rem 1rem 1.4rem}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nm2{display:none}
}
.demo{display:flex;gap:.4rem;align-items:center;justify-content:center;padding:.9rem;font-size:.78rem;color:var(--soft)}
.demo button{font:500 .78rem var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);padding:.25rem .7rem;cursor:pointer}
.demo button[aria-pressed=true]{background:var(--ink);color:var(--cell);border-color:var(--ink)}
.sq{background:var(--grad)}
.logo{width:64px;height:64px;display:block;flex:none}
.logo.xl{width:84px;height:84px}
.big{display:flex;justify-content:center;align-items:center;gap:.25em;flex-wrap:wrap}
.big span+span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== hero v2: hotel motion graphics + drop-in wordmark (แรงบันดาลใจ: wordmark newsletter) ===== */
.hero2{position:relative;overflow:hidden;background:var(--cell);--cyc:18s}
.hero2 #scene{display:block;width:100%;height:auto;aspect-ratio:1400/250;background:#FDEBD3}
.sk{opacity:0}.sunset{animation:sunset var(--cyc) linear infinite}.night{animation:night var(--cyc) linear infinite}
@keyframes sunset{0%,38%{opacity:0}46%{opacity:1}56%{opacity:.9}66%,100%{opacity:0}}
@keyframes night{0%,50%{opacity:0}62%,88%{opacity:1}100%{opacity:0}}
.orbit{transform-origin:700px 340px;animation:orb var(--cyc) linear infinite}
@keyframes orb{from{transform:rotate(-75deg)}to{transform:rotate(285deg)}}
.moonbite{fill:#2A2160}
.stars circle{opacity:0;animation:tw 3s ease-in-out infinite}
.stars{animation:starsv var(--cyc) linear infinite}
@keyframes starsv{0%,52%{opacity:0}62%,88%{opacity:1}100%{opacity:0}}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.cloud{animation:drift 40s linear infinite}.c1{transform:translate(-120px,0)}.c2{animation-duration:55s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(1560px)}}
.plane{animation:fly 26s linear infinite;animation-delay:-6s}
@keyframes fly{from{transform:translate(-120px,40px)}to{transform:translate(1500px,18px)}}
.w{fill:#FFE9A8;opacity:.25}
.w{animation:win var(--cyc) linear infinite;animation-delay:var(--d)}
@keyframes win{0%,40%{opacity:.25}52%,90%{opacity:calc(.35 + var(--on)*.65)}100%{opacity:.25}}
.neon text{animation:neon 2.4s steps(1) infinite}@keyframes neon{0%,86%,100%{opacity:1}90%{opacity:.35}94%{opacity:1}97%{opacity:.4}}
.lamps{animation:lamp var(--cyc) linear infinite}@keyframes lamp{0%,44%{opacity:.25}56%,92%{opacity:1}100%{opacity:.25}}
.bell{transform-box:fill-box;transform-origin:50% 0;animation:ding 6s ease-in-out infinite}
@keyframes ding{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(6deg)}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:rg 6s ease-out infinite}.r2{animation-delay:.25s}
@keyframes rg{0%,82%{opacity:0;transform:scale(.6)}84%{opacity:.9}100%{opacity:0;transform:scale(3)}}
.cart{animation:push 14s linear infinite;animation-delay:-3s}
@keyframes push{from{transform:translateX(-160px)}to{transform:translateX(1500px)}}
.bh{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}
.key{transform-origin:70px 0;animation:sw 4.2s ease-in-out infinite}.key{transform-box:view-box}
@keyframes sw{0%,100%{transform:translate(70px,-4px) rotate(9deg)}50%{transform:translate(70px,-4px) rotate(-9deg)}}
.sparks circle{opacity:0}
.hero2.wel .sparks circle{animation:sp 1.4s ease-out both}@keyframes sp{0%{opacity:0;transform:translateY(20px) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px) scale(1.4)}}
.hero2.wel .w{opacity:1;animation:none}
/* wordmark: ตัวอักษรร่วงเข้า/ออกทีละตัว (เหมือนแรงบันดาลใจ) */
.wm{margin:0;text-align:center;font:700 clamp(3.6rem,11.5vw,9rem)/1 var(--display);letter-spacing:.01em;height:1.5em;overflow:hidden;padding-top:.3em;position:relative;margin-top:0;white-space:nowrap}
.hero2.wel .wm{font-size:clamp(2.6rem,8vw,6.4rem)}
.wm .g{display:inline-block;transform:translateY(-140%);will-change:transform}
.wm .g.a{color:var(--ink)}.wm .g.b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm .g.in{animation:gin .56s cubic-bezier(.2,1.22,.36,1) both;animation-delay:calc(var(--i)*45ms)}
.wm .g.out{animation:gout .3s cubic-bezier(.5,0,.75,.3) both;animation-delay:calc(var(--i)*24ms)}
@keyframes gin{from{transform:translateY(-140%)}to{transform:none}}
@keyframes gout{from{transform:none}to{transform:translateY(140%)}}
.wm small{display:block;position:absolute;right:1.2rem;bottom:.6rem;font:500 .8rem var(--display);letter-spacing:.14em;color:var(--soft)}
.mockbar{max-width:1400px;margin:0 auto;padding:.6rem 1rem;font:500 .85rem var(--body)}.mockbar b{color:var(--purple)}
.mockbar .tg2{display:inline-block;background:#FFF1C7;color:#7A5A00;border-radius:99px;font-size:.75rem;padding:2px 12px;font-weight:600;margin-right:.5rem}
@media (prefers-reduced-motion:reduce){.hero2 *{animation:none!important}.wm .g{transform:none!important}.w{opacity:.7}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--purple)"/><stop offset="1" style="stop-color:var(--pink)"/></linearGradient>
 <symbol id="logo" viewBox="0 0 100 100">
  <path d="M40 16H62Q84 16 84 38V60L92 92L58 84H38Q16 84 16 62V40" fill="none" stroke="var(--soft)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="var(--soft)"><rect x="28" y="44" width="6" height="32" rx="3"/><circle cx="43" cy="55" r="5.5"/><path d="M51 50h15q6 0 6 6v4H51z"/><rect x="30" y="61" width="44" height="8" rx="3"/><rect x="69" y="60" width="6" height="16" rx="3"/></g>
  <path d="M26 2Q29 21 48 24Q29 27 26 46Q23 27 4 24Q23 21 26 2z" fill="url(#gg)"/>
  <path d="M52 24Q53.5 31 60 32.5Q53.5 34 52 41Q50.5 34 44 32.5Q50.5 31 52 24z" fill="url(#gg)"/>
 </symbol></defs></svg>
<div class="mockbar"><span class="tg2">ภาพตัวอย่าง · ยังไม่ได้ทำในระบบจริง</span>ตัวอักษร <b>พบรักรีสอร์ท</b> ร่วงเข้าทีละตัว · ภาพเคลื่อนไหวโรงแรมวนทั้งวัน-คืน · <b>ลองแตะบัญชีเพื่อดูตอนเข้าสู่ระบบสำเร็จ</b></div>
<div class="sheet">
  <div class="row top">
    <div class="cellx"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg><div><span class="nm1">PROMPT PAK</span><span class="nm2">PMS</span></div></div>
  </div>

  <div class="row"><div class="hero2" id="hero" aria-label="พบรักรีสอร์ท">
 <svg id="scene" viewBox="0 0 1400 250" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
   <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3F6"/><stop offset="1" stop-color="#FDEBD3"/></linearGradient>
   <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F1A4A"/><stop offset="1" stop-color="#5A3A86"/></linearGradient>
   <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E5BB0"/><stop offset="1" stop-color="#FFB27A"/></linearGradient>
   <radialGradient id="glow"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1400" height="250" fill="url(#skyD)"/>
  <rect class="sk sunset" width="1400" height="250" fill="url(#skyS)"/>
  <rect class="sk night" width="1400" height="250" fill="url(#skyN)"/>
  <g class="stars" fill="#fff"><circle cx="120" cy="30" r="1.6" style="animation-delay:0s"/><circle cx="260" cy="70" r="1.2" style="animation-delay:0.8s"/><circle cx="380" cy="24" r="1.8" style="animation-delay:1.4s"/><circle cx="520" cy="60" r="1.3" style="animation-delay:0.3s"/><circle cx="640" cy="20" r="1.6" style="animation-delay:2s"/><circle cx="780" cy="48" r="1.2" style="animation-delay:1s"/><circle cx="900" cy="26" r="1.7" style="animation-delay:0.5s"/><circle cx="1040" cy="66" r="1.3" style="animation-delay:1.8s"/><circle cx="1160" cy="30" r="1.6" style="animation-delay:0.2s"/><circle cx="1290" cy="58" r="1.4" style="animation-delay:1.2s"/><circle cx="80" cy="96" r="1.2" style="animation-delay:1.6s"/><circle cx="1340" cy="110" r="1.3" style="animation-delay:0.7s"/></g>
  <g class="orbit"><circle cx="700" cy="-120" r="30" fill="#FFC857"/><circle cx="700" cy="-120" r="62" fill="url(#glow)"/><g transform="rotate(180 700 340)"><circle cx="700" cy="-120" r="24" fill="#FFF6D6"/><circle cx="711" cy="-126" r="21" fill="#1F1A4A" class="moonbite"/></g></g>
  <g class="cloud c1" fill="#fff" opacity=".85"><ellipse cx="0" cy="60" rx="60" ry="16"/><ellipse cx="34" cy="50" rx="34" ry="16"/><ellipse cx="-30" cy="52" rx="28" ry="12"/></g>
  <g class="cloud c2" fill="#fff" opacity=".7"><ellipse cx="0" cy="110" rx="48" ry="12"/><ellipse cx="26" cy="102" rx="26" ry="12"/></g>
  <g class="plane"><path d="M0 0l30 6-30 6 6-6z" fill="#fff"/><path d="M-60 6h58" stroke="#fff" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/></g>
  <!-- skyline -->
  <g fill="#C9B8DD" class="far"><rect x="40" y="150" width="70" height="100"/><rect x="120" y="170" width="50" height="80"/><rect x="1180" y="140" width="80" height="110"/><rect x="1270" y="165" width="60" height="85"/><rect x="330" y="185" width="60" height="65"/><rect x="1010" y="180" width="70" height="70"/></g>
  <g class="trees" fill="#6FAE7A"><circle cx="210" cy="215" r="22"/><rect x="207" y="225" width="6" height="25" fill="#7A5A3A"/><circle cx="1130" cy="213" r="24"/><rect x="1127" y="224" width="6" height="26" fill="#7A5A3A"/><circle cx="420" cy="222" r="16"/><rect x="418" y="230" width="4" height="20" fill="#7A5A3A"/></g>

  <div class="cards">${saved.map(k=>{const a=ACC[k];return `<button class="acc ${a.cls}" data-k="${k}" aria-label="เข้าสู่ระบบเป็น ${esc(a.name)}">
    <span class="rm" role="button" tabindex="0" data-rm="${k}" aria-label="ลบบัญชี ${esc(a.name)} ออกจากเครื่องนี้">×</span>
    <span class="av">${a.ini}</span><span class="nm">${esc(a.name)}</span><span class="role">${a.role}</span><span class="last">${a.last}</span></button>`}).join('')}
    <button class="acc add" id="addAcc" aria-label="เข้าสู่ระบบด้วยบัญชีอื่น"><span class="av">+</span><span class="nm">บัญชีอื่น</span><span class="last">ใส่ชื่อผู้ใช้และรหัสผ่าน</span></button></div>`;
  box.querySelectorAll('.acc[data-k]').forEach(b=>b.addEventListener('click',e=>{
    const rm=e.target.closest('[data-rm]');
    if(rm){e.stopPropagation();saved=saved.filter(x=>x!==rm.dataset.rm);cards();return}
    enter(b.dataset.k)}));
  box.querySelectorAll('[data-rm]').forEach(r=>r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();saved=saved.filter(x=>x!==r.dataset.rm);cards()}}));
  document.getElementById('addAcc').onclick=()=>form(true);
}
function form(canBack){
  box.innerHTML=`${canBack&&saved.length?'<button class="lnk" id="bk" style="margin-bottom:.8rem">‹ กลับไปบัญชีล่าสุด</button>':''}
  <h2>เข้าสู่ระบบ</h2><p class="sub">ใช้ชื่อผู้ใช้และรหัสผ่านของคุณ</p>
  <form id="f" novalidate>
   <label class="field"><span>ชื่อผู้ใช้</span><input type="text" id="u" autocomplete="username" placeholder="เช่น owner หรือ frontdesk"></label>
   <label class="field"><span>รหัสผ่าน</span><div class="pw"><input type="password" id="p" autocomplete="current-password"><button type="button" id="sh">แสดง</button></div></label>
   <div class="err" id="er" hidden>กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบ</div>
   <label class="chk"><input type="checkbox" id="rem" checked><span>จดจำบัญชีนี้บนอุปกรณ์นี้<br><small style="color:var(--soft)">ครั้งต่อไปแตะการ์ดบัญชีเพื่อเข้าได้เลย</small></span></label>
   <button class="cut full" type="submit">เข้าสู่ระบบ</button>
   <div class="rowb"><button type="button" class="lnk" id="fg">ลืมรหัสผ่าน</button></div>
  </form>`;
  if(document.getElementById('bk'))document.getElementById('bk').onclick=cards;
  const p=document.getElementById('p');
  document.getElementById('sh').onclick=e=>{const s=p.type==='password';p.type=s?'text':'password';e.target.textContent=s?'ซ่อน':'แสดง'};
  document.getElementById('f').onsubmit=e=>{e.preventDefault();
    const u=document.getElementById('u').value.trim();
    if(!u||!p.value){document.getElementById('er').hidden=false;return}
    const k=u.toLowerCase()==='owner'?'owner':'staff';
    if(document.getElementById('rem').checked&&!saved.includes(k))saved.push(k);
    enter(k)};
}
function enter(k){
  const a=ACC[k];
  box.innerHTML=`<div class="loading"><div class="acc ${a.cls}" style="all:unset"><div class="av" style="margin:0 auto;width:84px;height:84px">${a.ini}</div></div>
   <h2 style="margin-top:1rem">กำลังเข้าสู่ระบบ</h2><p class="sub">${esc(a.name)}</p><div class="spin" aria-hidden="true"></div></div>`;
  box.querySelector('.acc').className='owner-av '+a.cls;
  setTimeout(()=>{if(window.parent!==window){try{parent.postMessage({pbr:'login',role:k,name:a.name,roleTh:a.role},'*')}catch(_){}return}box.innerHTML=`<div class="loading"><div class="tick" aria-hidden="true">✓</div><h2>เข้าสู่ระบบแล้ว</h2>
   <p class="sub">${esc(a.name)} · ${a.role==='เจ้าของ'?'เห็นทุกเมนู รวมรายงานและตั้งค่า':'เห็นเมนูหน้างาน เช่น หน้าแรก การจอง แม่บ้าน'}</p>
   <p class="sub" style="font-size:.8rem">ตัวอย่างเท่านั้น ยังไม่ได้เชื่อมกับระบบจริง</p>
   <button class="lnk" id="out">ออกจากระบบ</button></div>`;
   document.getElementById('out').onclick=()=>{saved.length?cards():form()}},1300);
}
document.getElementById('v1').onclick=()=>setV(1);
document.getElementById('v2').onclick=()=>setV(2);
window.addEventListener('message',e=>{if(e.data&&e.data.pbr==='loginshow'){if(saved.length)cards();else form()}});
if(window.parent!==window){const d=document.querySelector('.demo');if(d)d.hidden=true}

/* ---- hero v2 ---- */
const WM=document.getElementById('wm'),HERO=document.getElementById('hero');
const seg=t=>{try{return [...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(t)].map(x=>x.segment)}catch(e){return [...t]}};
function setWord(parts,anim){ // parts: [[text,'a'|'b'],...]
  let i=0;WM.innerHTML=parts.map(([t,c])=>seg(t).map(g=>g.trim()===''?`<span class="g" style="--i:${i++}">&nbsp;</span>`:`<span class="g ${c} ${anim}" style="--i:${i++}">${g}</span>`).join('')).join('');
  WM.setAttribute('aria-label',parts.map(p=>p[0]).join(''))}
function dropOutThenIn(parts,after){
  WM.querySelectorAll('.g').forEach(g=>{g.classList.remove('in');g.classList.add('out')});
  const n=WM.querySelectorAll('.g').length;setTimeout(()=>{setWord(parts,'in');after&&after()},300+n*24+60)}
setWord([['พบรัก ','a'],['รีสอร์ท','b']],'in');
let welcomed=false;
const _enter=enter;enter=function(k){welcomed=true;HERO.classList.add('wel');
  const sp=HERO.querySelector('.sparks');sp.innerHTML=sp.innerHTML; // เริ่มประกายใหม่
  dropOutThenIn([['ยินดีต้อนรับ ','a'],[ACC[k].ini==='จ'?'เจ้าของ':'ทีมงาน','b']]);_enter(k)};
function resetHero(){if(!welcomed)return;welcomed=false;HERO.classList.remove('wel');dropOutThenIn([['พบรัก ','a'],['รีสอร์ท','b']])}
const _cards=cards;cards=function(){resetHero();_cards()};const _form=form;form=function(b){resetHero();_form(b)};
cards();
</script>
