<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login v5 — พบรักรีสอร์ท</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Noto+Sans+Thai:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#2A1750;--name:#4A3382;--low:#E7D8F8;--road:#D2BDF0;--ink:#2A1750;--pur:#6A3AA2;--hot:#C2287F;--yel:#FFD66B;--body:'IBM Plex Sans Thai',sans-serif;--disp:'Noto Sans Thai','IBM Plex Sans Thai',sans-serif;--bar:64px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:relative;height:100vh;height:100dvh;overflow:hidden;overflow:clip;background:radial-gradient(ellipse at 50% 30%,#3A2270 0,var(--bg) 70%)}
/* ===== แถบขาว ชื่อระบบ ===== */
.bar{position:absolute;left:0;right:0;top:0;height:var(--bar);background:#fff;display:flex;align-items:center;gap:.8rem;padding:0 1.4rem;z-index:30;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bar .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6A3AA2,#C2287F);display:grid;place-items:center;flex:none}
.bar b{font:700 1.55rem var(--body);letter-spacing:.07em;color:var(--ink)}
.bar i{font:700 .9rem var(--body);font-style:normal;color:#fff;background:var(--hot);padding:.2rem .8rem;border-radius:99px;letter-spacing:.2em}
/* ===== เลเยอร์บน : ชื่อโรงแรมนิ่ง + ของลอย ===== */
.name{position:absolute;left:0;right:0;top:calc(var(--bar) + 2vh);text-align:center;font:900 clamp(3.6rem,17vh,11rem)/1.35 var(--disp);color:var(--name);white-space:nowrap;user-select:none;z-index:1}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#A78BE0;opacity:.2;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.85}}
.float{position:absolute;z-index:2;pointer-events:none}
.plane{top:calc(var(--bar) + 1.5vh);left:0;width:130px;animation:fly 34s linear infinite;animation-delay:-8s}
@keyframes fly{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 40px))}}
.balloon{left:5%;top:36vh;width:92px;animation:bl 6s ease-in-out infinite;transform-origin:50% 0}
@keyframes bl{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.moon{right:6%;top:calc(var(--bar) + 6vh);width:70px;animation:bl 8s ease-in-out infinite}
/* ===== เลเยอร์ล่าง ===== */
.stage,.sky{contain:paint}
.sky{position:absolute;left:0;right:0;bottom:30%;height:min(25vh,210px);z-index:2;overflow:hidden;pointer-events:none}
.sky .trk{display:flex;height:100%;width:max-content;animation:run 150s linear infinite}
.sky svg{height:100%;width:auto;flex:none;display:block}
.low{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(var(--low) 0 74%,var(--road) 74%);z-index:2}
.tape{position:absolute;left:0;bottom:.6vh;display:flex;width:max-content;animation:run 78s linear infinite;z-index:4}
.tape>svg{height:min(35vh,300px);width:auto;flex:none;overflow:visible;display:block}
@keyframes run{to{transform:translateX(-50%)}}
.sw{fill:#CDB6EE}.sw.l{fill:var(--yel);animation:lit 8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes lit{0%,100%{opacity:.2}50%{opacity:1}}
.wel .sw{fill:var(--yel);animation:none;opacity:1}
.fw{transform-box:fill-box;transform-origin:center;animation:spn 60s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
/* ตัวละคร + ของเคลื่อนไหว */
.wk1,.wk2{transform-box:fill-box;transform-origin:50% 0;animation:wk .55s ease-in-out infinite alternate}.wk2{animation-direction:alternate-reverse}
@keyframes wk{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.arm{transform-box:fill-box;transform-origin:50% 8%}.as{animation:as .55s ease-in-out infinite alternate}.as.b{animation-direction:alternate-reverse}
@keyframes as{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.wave{animation:wv .45s ease-in-out infinite alternate}@keyframes wv{from{transform:rotate(145deg)}to{transform:rotate(195deg)}}
.br{transform-box:fill-box;transform-origin:50% 100%;animation:br 3s ease-in-out infinite}@keyframes br{50%{transform:scaleY(1.025)}}
.bump{transform-box:fill-box;transform-origin:50% 100%;animation:bp 1.3s ease-in-out infinite}@keyframes bp{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-2px)}}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wb 1.3s ease-in-out infinite}.wob.d{animation-delay:-.4s}@keyframes wb{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sy 4.5s ease-in-out infinite}@keyframes sy{50%{transform:rotate(4deg)}}
.whl{transform-box:fill-box;transform-origin:center;animation:spn .45s linear infinite}
.hd{transform-box:fill-box;transform-origin:50% 100%;animation:spn 12s linear infinite}.hd.h{animation-duration:140s}
.dl,.dr{transform-box:fill-box;animation:dor 9s ease-in-out infinite}.dl{transform-origin:0 50%}.dr{transform-origin:100% 50%}
@keyframes dor{0%,15%{transform:scaleX(1)}27%,62%{transform:scaleX(.07)}74%,100%{transform:scaleX(1)}}
.stp{animation:stp 9s ease-in-out infinite}@keyframes stp{0%,28%{transform:translateX(0)}42%,54%{transform:translateX(66px)}68%,100%{transform:translateX(0)}}
.led{animation:led 1.4s steps(1) infinite}@keyframes led{50%{opacity:.2}}
.glow{animation:gl 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{50%{opacity:.35;transform:scale(1.15)}}
.scr{animation:sc 2.4s steps(1) infinite}@keyframes sc{0%{fill:#7FD6EE}30%{fill:#FFD66B}60%{fill:#F29AC1}}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:rg 3.4s ease-out infinite}@keyframes rg{0%,40%{opacity:0;transform:scale(.4)}46%{opacity:.9}100%{opacity:0;transform:scale(2.6)}}
.ding{transform-box:fill-box;transform-origin:50% 100%;animation:dn 3.4s ease-in-out infinite}@keyframes dn{0%,40%,100%{transform:none}44%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}56%{transform:rotate(-4deg)}}
.hop{animation:hop .9s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.trunk{animation:tr 5s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}@keyframes tr{0%,100%{transform:rotate(-75deg)}}
.lift{animation:lf 3.6s ease-in-out infinite}@keyframes lf{0%,100%{transform:translate(0,0)}45%{transform:translate(-20px,-26px) rotate(-8deg)}70%{transform:translate(10px,0)}}
.runk{animation:rk 1.8s ease-in-out infinite alternate}@keyframes rk{to{transform:translateX(-34px)}}
.balx{transform-box:fill-box;transform-origin:50% 100%;animation:bx 2.2s ease-in-out infinite}@keyframes bx{50%{transform:rotate(9deg) translateY(-5px)}}
.rip{animation:rp 3s linear infinite}@keyframes rp{to{transform:translateX(30px)}}
.dive{animation:dv 5s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes dv{0%{transform:translate(0,0) rotate(0);opacity:1}30%{transform:translate(-44px,-52px) rotate(180deg)}58%{transform:translate(-100px,10px) rotate(380deg);opacity:1}60%,100%{transform:translate(-100px,16px) rotate(380deg);opacity:0}}
.spl{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:sp 5s ease-out infinite}@keyframes sp{0%,58%{opacity:0;transform:scale(.2)}64%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.5) translateY(-10px)}}
.steam{animation:st 2.4s ease-in infinite;opacity:0}.steam.b{animation-delay:.8s}.steam.c{animation-delay:1.6s}
@keyframes st{0%{opacity:0;transform:translateY(6px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.cloud{animation:cd 14s linear infinite}@keyframes cd{from{transform:translateX(-60px)}to{transform:translateX(230px)}}
.sprk{transform-box:fill-box;transform-origin:center;animation:tw2 1.8s ease-in-out infinite}@keyframes tw2{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(30deg);opacity:1}}
/* ===== การ์ดคีย์การ์ดห้อยจากแถบขาว ===== */
.boxes{position:absolute;top:var(--bar);left:50%;transform:translateX(-50%);display:flex;gap:2.1rem;z-index:8;align-items:flex-start}
.hang{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:swing 5.2s ease-in-out infinite;animation-delay:var(--sd);cursor:pointer;-webkit-user-select:none;user-select:none}
@keyframes swing{0%,100%{transform:rotate(2.8deg)}50%{transform:rotate(-2.8deg)}}
.lan{width:11px;height:min(19vh,160px);background:repeating-linear-gradient(135deg,var(--c1) 0 6px,rgba(255,255,255,.55) 6px 9px);border-radius:0 0 2px 2px}
.clip{width:24px;height:16px;border-radius:5px;background:linear-gradient(#E6ECF2,#9AA7B5);margin-top:-2px;margin-bottom:-9px;z-index:2;position:relative}
.clip::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#6C7886;transform:translate(-50%,-50%)}
.card{--c1:#7B3FE4;--c2:#C2287F;position:relative;width:min(26vw,196px);height:min(36vh,292px);border-radius:20px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;display:flex;flex-direction:column;align-items:center;padding:0 .9rem 1rem;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.28),inset 0 0 0 5px rgba(255,255,255,.18);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.hang:hover .card{transform:translateY(-4px) rotate(-2deg)}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 0 0,rgba(255,255,255,.22) 0 2px,transparent 3px) 0 0/16px 16px;opacity:.5;pointer-events:none}
.card::after{content:'';position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:rotate(18deg);animation:shine 5.5s ease-in-out infinite;animation-delay:var(--sd);pointer-events:none}
@keyframes shine{0%,60%{left:-60%}85%,100%{left:140%}}
.slot{position:absolute;top:11px;left:50%;width:40px;height:9px;border-radius:5px;background:rgba(0,0,0,.4);transform:translateX(-50%)}
.stripe{position:absolute;left:0;right:0;top:30px;height:30px;background:#1A0E33}
.wm2{position:absolute;right:-6px;bottom:-16px;font:900 5.6rem/1 var(--disp);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.28);pointer-events:none}
.av{position:relative;margin-top:44px;width:min(21vw,86px);height:min(21vw,86px);border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.95);box-shadow:0 5px 0 rgba(0,0,0,.25);overflow:hidden;flex:none;display:grid;place-items:center;transition:transform .3s}
.hang:hover .av{transform:scale(1.08) rotate(-5deg)}
.card b{position:relative;margin-top:.7rem;font:700 1.02rem/1.25 var(--body);text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.role{position:relative;margin-top:.35rem;font:600 .72rem var(--body);letter-spacing:.1em;background:rgba(255,255,255,.22);border-radius:99px;padding:.15rem .7rem}
.deco{position:absolute;left:.9rem;right:.9rem;bottom:.9rem;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.chipg{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#FFE9A0,#E0A82E);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.2)}
.chipg i{background:rgba(0,0,0,.18);border-radius:2px}
.sprk2{width:26px;animation:tw2 2.2s ease-in-out infinite}
.pw{display:none;position:relative;margin-top:auto;width:100%;flex-direction:column;align-items:center;gap:.55rem}
.hang.on .pw{display:flex}.hang.on .deco,.hang.on .role,.hang.on .wm2{display:none}
.dots{display:flex;gap:7px;position:relative;padding:.35rem}
.dots i{width:15px;height:15px;border-radius:50%;border:2.5px solid #fff;background:rgba(255,255,255,.2);transition:.15s}
.dots i.f{background:var(--yel);border-color:var(--yel);transform:scale(1.2)}
.dots input{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;border:0;background:none}
.user{width:100%;border:0;border-radius:99px;background:rgba(255,255,255,.9);padding:.5rem .8rem;font:600 .9rem var(--body);text-align:center;color:var(--ink);outline:0}
.go{border:0;cursor:pointer;background:var(--yel);color:var(--ink);font:700 .95rem var(--body);border-radius:99px;padding:.55rem 1.2rem;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:.12s;display:flex;align-items:center;gap:.4rem}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.go.rdy{animation:pls .7s ease-in-out infinite alternate}@keyframes pls{to{transform:scale(1.08)}}
.hang.on{animation:none!important;transform:rotate(0)}
.hang.on .card{transform:translateY(14px) scale(1.07);box-shadow:0 0 0 4px var(--yel),0 18px 0 rgba(0,0,0,.28),inset 0 0 0 5px rgba(255,255,255,.18)}
.hang.on .av{transform:none}
.card.plus{--c1:#FFF3D6;--c2:#FFE0C0;color:var(--ink)}.card.plus .stripe{background:#CDB89A}.card.plus .role{background:rgba(42,23,80,.1)}.card.plus b{text-shadow:none}
.card.plus .dots i{border-color:var(--ink);background:rgba(42,23,80,.08)}.card.plus .dots i.f{background:var(--hot);border-color:var(--hot)}
.card.plus .wm2{-webkit-text-stroke:2px rgba(42,23,80,.12)}
.okb{display:none;position:absolute;inset:0;background:linear-gradient(160deg,#2EC27E,#1B8F5C);flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;z-index:5}
.okb svg{width:74px;height:74px}.okb path{stroke-dasharray:40;stroke-dashoffset:40}
.okb em{font:700 1.15rem var(--body);font-style:normal;color:#fff}.okb a{color:#fff;font:600 .82rem var(--body);opacity:.85;text-decoration:underline;padding:.3rem}
.hang.ok .okb{display:flex}.hang.ok .okb path{animation:dr .5s .2s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.hang.ok .card{animation:tap .6s ease-out}@keyframes tap{0%{transform:translateY(14px) scale(1.07)}30%{transform:translateY(60px) scale(1.07)}100%{transform:translateY(14px) scale(1.07)}}
.wel .hang:not(.ok){animation:fall 1.1s cubic-bezier(.5,0,.9,.4) forwards!important}
@keyframes fall{0%{transform:rotate(0)}30%{transform:rotate(-14deg)}100%{transform:translateY(60vh) rotate(26deg);opacity:0}}
.cf{position:absolute;z-index:40;width:30px;pointer-events:none;animation:cfa 1.3s ease-out forwards}
@keyframes cfa{from{opacity:1;transform:translate(0,0) scale(.3)}to{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.3) rotate(160deg)}}
@media (max-width:700px){.boxes{gap:.5rem}.card{width:30vw;padding:0 .4rem .7rem}.card b{font-size:.82rem}.av{width:56px;height:56px}.wm2{font-size:3.6rem}.balloon,.moon{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
