<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แชท LINE · PROMPT PAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<main class="main">
  <div class="head">
    <div class="hi" id="hi"></div><h1>แชทลูกค้า LINE</h1>
    <div class="live"><span class="dot"></span><span id="upd">กำลังโหลด…</span></div>
  </div>
  <div class="chat">
    <div class="card threads" id="threads"></div>
    <div class="card conv">
      <div class="top" id="top"><span class="muted">เลือกแชทด้านซ้าย</span></div>
      <div class="msgs" id="msgs"></div>
    </div>
  </div>
</main>
</div>
<script type="module">
import { rail, api, icon, esc, time, setBadge, toast } from '/assets/app.js';
rail('/chats');
document.getElementById('hi').innerHTML = icon('chat');
let cur = null, lastCount = -1;
const TOOL = { check_availability: 'เช็คห้องว่าง', create_booking: 'สร้างการจอง', handoff_to_staff: 'ส่งต่อพนักงาน' };

async function loadThreads() {
  const ts = await api('/api/chats');
  setBadge(ts.filter(t => t.needs_staff).length);
  if (!cur && ts.length) cur = ts[0].id;
  document.getElementById('threads').innerHTML = ts.map(t => `<button class="th" data-id="${t.id}" aria-current="${t.id === cur}">
    <div class="n">${esc(t.display_name || 'ลูกค้า LINE')}${t.needs_staff ? '<span class="chip due">รอพนักงาน</span>' : ''}${t.is_seed ? '<span class="chip">ตัวอย่าง</span>' : ''}</div>
    <div class="p">${esc(t.last_body || '')}</div><div class="p">${time(t.last_message_at)}</div></button>`).join('') || '<div class="empty">ยังไม่มีแชท</div>';
}

async function loadConv() {
  if (!cur) return;
  const d = await api('/api/chats?id=' + cur);
  const t = d.thread;
  document.getElementById('top').innerHTML = `<b>${esc(t.display_name || 'ลูกค้า LINE')}</b>
    ${t.needs_staff ? `<span class="chip due">AI ส่งต่อพนักงาน: ${esc(t.handoff_reason || '')}</span><button class="btn pri" id="resolve" style="margin-left:auto">จบเรื่อง ให้ AI ตอบต่อ</button>` : '<span class="chip ai">AI ตอบอัตโนมัติ</span>'}`;
  if (t.needs_staff) document.getElementById('resolve').onclick = async () => {
    await api('/api/chats', { method: 'POST', body: JSON.stringify({ id: cur, action: 'resolve' }) });
    toast('เปิดให้ AI ตอบแชทนี้อีกครั้งแล้ว'); refresh();
  };
  const box = document.getElementById('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = d.messages.map(m => {
    const cls = { 'ลูกค้า': 'c', 'AI': 'a', 'พนักงาน': 's', 'ระบบ': 'y' }[m.sender];
    const acts = (m.meta?.actions || []).map(a => `<span class="chip ${a.ok ? 'ai' : 'due'}">${a.ok ? '✓' : '✗'} ${TOOL[a.tool] || a.tool}${a.error ? ': ' + esc(a.error) : ''}</span>`).join('');
    return `<div class="msg ${cls}">${esc(m.body)}${acts ? `<div class="acts">${acts}</div>` : ''}<span class="w">${m.sender === 'AI' ? '✨ AI · ' : m.sender === 'พนักงาน' ? 'พนักงาน · ' : ''}${time(m.at)}</span></div>`;
  }).join('');
  if (atBottom || d.messages.length !== lastCount) box.scrollTop = box.scrollHeight;
  lastCount = d.messages.length;
}

async function refresh() {
  try {
    await loadThreads(); await loadConv();
    document.getElementById('upd').textContent = 'อัปเดตอัตโนมัติ · ล่าสุด ' + time(new Date().toISOString()).split(' ').pop();
  } catch (e) { document.getElementById('upd').textContent = 'โหลดไม่สำเร็จ: ' + e.message; }
}
document.getElementById('threads').addEventListener('click', e => {
  const b = e.target.closest('.th'); if (!b) return;
  cur = Number(b.dataset.id); lastCount = -1; refresh();
});
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
