<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าแรก · PROMPT PAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<main class="main">
  <div class="head">
    <div class="hi" id="hi"></div><h1>หน้าแรก</h1>
    <div class="live"><span class="dot"></span><span id="upd">กำลังโหลด…</span></div>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="card aibox">
    <div class="row">
      <h2 id="aiTitle"></h2>
      <span class="muted" style="font-size:.85rem">อ่านการจองและแชทจริง แล้วสรุปสิ่งที่ต้องทำ</span>
      <button class="btn pri" id="sumBtn" style="margin-left:auto"></button>
    </div>
    <div class="out" id="sumOut"></div>
    <div class="facts" id="sumFacts"></div>
  </section>

  <section class="card" style="margin-bottom:1rem" id="aiBox">
    <h2 id="aiNewTitle"></h2>
    <div id="aiNew" class="cols" style="grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))"></div>
  </section>

  <section class="cols">
    <div class="card col in"><div class="ch" id="hIn"></div><div class="list" id="lIn"></div></div>
    <div class="card col stay"><div class="ch" id="hStay"></div><div class="list" id="lStay"></div></div>
    <div class="card col out"><div class="ch" id="hOut"></div><div class="list" id="lOut"></div></div>
  </section>
</main>
</div>
<script type="module">
import { rail, api, icon, parts, th, baht, esc, payChip, aiChip, toast, setBadge, bookingDrawer, time } from '/assets/app.js';
rail('/');
document.getElementById('hi').innerHTML = icon('home');
document.getElementById('aiTitle').innerHTML = icon('spark') + ' AI สรุปให้เจ้าของ';
document.getElementById('sumBtn').innerHTML = icon('spark') + ' สรุปตอนนี้';
document.getElementById('aiNewTitle').innerHTML = icon('spark') + ' การจองล่าสุดที่ AI รับผ่าน LINE';
const hdr = (ic, t, n) => `${icon(ic)}<span>${t}</span><span class="n">${n}</span>`;

let seen = null, byNo = {};
function card(b, extra = '') {
  byNo[b.booking_no] = b;
  return `<div class="g ${extra}" data-no="${esc(b.booking_no)}" role="button" tabindex="0">
    <div class="t"><span class="rm">${esc(b.room_id)}</span><span>${esc(b.guest_name)}</span><span class="ni">${b.nights} คืน</span></div>
    <div class="m">${esc(b.booking_no)} · ${th(b.check_in)} – ${th(b.check_out)}${b.company ? ' · ' + esc(b.company) : ''}</div>
    <div class="tags">${aiChip(b)}${payChip(b.payment_status)}</div></div>`;
}
const list = (arr, extra) => arr.length ? arr.map(b => card(b, extra?.(b))).join('') : '<div class="empty">ไม่มีรายการ</div>';

async function load() {
  const d = await api('/api/dashboard');
  const p = parts(d.date), free = d.rooms_total - d.occupied_tonight;
  const occ = Math.round(d.occupied_tonight / d.rooms_total * 100);
  document.getElementById('kpis').innerHTML = `
    <div class="card kpi today"><div class="lb">${icon('cal')} วันนี้</div>
      <div><div class="s">วัน${p.dowF}</div><div class="v serif">${p.day}</div><div class="s">${p.monF} ${p.year}</div></div></div>
    <div class="card kpi"><div class="lb"><i>${icon('bed')}</i>ห้องว่างคืนนี้</div><div class="v">${free}<small>/ ${d.rooms_total} ห้อง</small></div><div class="s">มีแขกพัก ${d.occupied_tonight} ห้อง</div></div>
    <div class="card kpi"><div class="lb"><i>${icon('gauge')}</i>อัตราเข้าพักคืนนี้</div><div class="v">${occ}%</div><div class="bar"><span style="width:${occ}%"></span></div></div>
    <div class="card kpi"><div class="lb"><i>${icon('spark')}</i>AI รับจองวันนี้</div><div class="v">${d.ai_bookings_today}<small>ห้อง</small></div><div class="s">ผ่าน LINE OA โดยไม่ต้องมีคนตอบ</div></div>
    <div class="card kpi"><div class="lb"><i>${icon('chat')}</i>แชทรอพนักงาน</div><div class="v">${d.chats_need_staff}<small>เรื่อง</small></div><div class="s"><a href="/chats">ไปที่แชท LINE →</a></div></div>`;
  setBadge(d.chats_need_staff);

  const nos = d.latest_ai.map(b => b.booking_no);
  const fresh = seen ? nos.filter(n => !seen.has(n)) : [];
  if (fresh.length) {
    const b = d.latest_ai.find(x => x.booking_no === fresh[0]);
    toast(`✨ การจองใหม่จาก LINE: ${b.guest_name} · ห้อง ${b.room_id} · ${th(b.check_in)}`, 6000);
  }
  seen = new Set([...(seen || []), ...nos]);
  const isNew = b => fresh.includes(b.booking_no) ? 'new' : '';
  document.getElementById('aiNew').innerHTML = d.latest_ai.length ? d.latest_ai.map(b => card(b, isNew(b))).join('')
    : '<div class="empty">ยังไม่มีการจองจาก AI — ลองทักแชท LINE OA แล้วขอจองห้องดูได้เลย</div>';

  document.getElementById('hIn').innerHTML = hdr('in', 'เช็คอิน', d.arrivals.length);
  document.getElementById('hStay').innerHTML = hdr('moon', 'เข้าพัก', d.in_house.length);
  document.getElementById('hOut').innerHTML = hdr('bag', 'เช็คเอาท์', d.departures.length);
  document.getElementById('lIn').innerHTML = list(d.arrivals, isNew);
  document.getElementById('lStay').innerHTML = list(d.in_house);
  document.getElementById('lOut').innerHTML = list(d.departures);
  document.getElementById('upd').textContent = 'อัปเดตอัตโนมัติ · ล่าสุด ' + time(new Date().toISOString()).split(' ').pop();
}

document.addEventListener('click', e => {
  const g = e.target.closest('.g[data-no]');
  if (g && byNo[g.dataset.no]) bookingDrawer(byNo[g.dataset.no]);
});

document.getElementById('sumBtn').onclick = async ev => {
  const btn = ev.currentTarget, out = document.getElementById('sumOut');
  btn.disabled = true; out.textContent = 'AI กำลังอ่านข้อมูลการจองและแชท…';
  try {
    const r = await api('/api/summary', { method: 'POST' });
    out.textContent = r.text;
    const t = r.data.next7[0];
    document.getElementById('sumFacts').innerHTML =
      `<span class="chip">ข้อมูลจริงจากระบบ:</span><span class="chip">คืนนี้มีแขก ${t.occupied}/${r.data.rooms_total} ห้อง</span>
       <span class="chip">เข้าวันนี้ ${t.arrivals}</span><span class="chip">ออกวันนี้ ${t.departures}</span>
       <span class="chip">จองใหม่ 24 ชม. ${r.data.new_bookings_24h.length}</span><span class="chip">แชทรอพนักงาน ${r.data.chats_need_staff.length}</span>`;
  } catch (e) { out.textContent = 'สรุปไม่สำเร็จ: ' + e.message; }
  btn.disabled = false;
};

load().catch(e => { document.getElementById('upd').textContent = 'โหลดไม่สำเร็จ: ' + e.message; });
setInterval(() => load().catch(() => {}), 10000);
</script>
</body>
</html>
