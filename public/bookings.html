<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การจอง · PROMPT PAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>.cal table{table-layout:fixed}.cal col.rc{width:6rem}.cal col.dc{width:3.7rem}</style>
</head>
<body>
<div class="app">
<main class="main">
  <div class="head">
    <div class="hi" id="hi"></div><h1>การจอง</h1>
    <div class="tabs" style="margin-left:1rem"><button id="tCal" aria-pressed="true">ปฏิทิน</button><button id="tList" aria-pressed="false">การจองทั้งหมด</button></div>
    <div class="live"><span class="dot"></span><span id="upd">กำลังโหลด…</span></div>
  </div>

  <div id="calView">
    <div class="tools">
      <div class="legend" style="margin:0">
        <span><i style="background:var(--grad)"></i>กำลังพัก</span>
        <span><i style="background:#F3D6E6;border:1px solid #E6B9D2"></i>กำลังจะมาถึง</span>
        <span><i style="background:#ECE8EC"></i>ผ่านมาแล้ว</span>
        <span><i style="background:#fff;box-shadow:inset 0 0 0 2px var(--purple)"></i>AI จองให้</span>
      </div>
      <div class="gr"><button class="ibtn" id="prev" aria-label="ก่อนหน้า"></button><b id="range"></b><button class="ibtn" id="next" aria-label="ถัดไป"></button><button class="btn sec" id="goToday">วันนี้</button></div>
    </div>
    <div class="cal" id="cal"></div>
  </div>

  <div id="listView" class="hide">
    <div class="tools">
      <input id="q" type="search" placeholder="ค้นหา ชื่อ / ห้อง / เลขจอง / บริษัท" style="flex:1;min-width:14rem">
      <select id="f"><option value="all">ทั้งหมด</option><option value="ai">AI จองให้</option><option value="up">กำลังจะมาถึง</option><option value="cx">ยกเลิก</option></select>
    </div>
    <div class="muted" id="cnt" style="font-size:.85rem;margin-bottom:.5rem"></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>เลขจอง</th><th>ลูกค้า</th><th>ห้อง</th><th>เข้า</th><th>ออก</th><th>คืน</th><th>ค่าห้อง</th><th>ชำระ</th><th>ที่มา</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
</div>
<script type="module">
import { rail, api, icon, parts, th, baht, esc, payChip, aiChip, bookingDrawer, addDays, dayDiff, setBadge, toast, time } from '/assets/app.js';
rail('/bookings');
document.getElementById('hi').innerHTML = icon('cal');
document.getElementById('prev').innerHTML = icon('left');
document.getElementById('next').innerHTML = icon('right');

const DAYS = 14;
let today = null, start = null, mode = 'cal', byNo = {}, listData = null, known = null;

function notifyNew(bookings) {
  const nos = bookings.filter(b => b.created_by === 'ai').map(b => b.booking_no);
  if (known) {
    const fresh = bookings.find(b => b.created_by === 'ai' && !known.has(b.booking_no));
    if (fresh) toast(`✨ การจองใหม่จาก LINE: ${fresh.guest_name} · ห้อง ${fresh.room_id} · ${th(fresh.check_in)}`, 6000);
  }
  known = new Set([...(known || []), ...nos]);
}

async function loadCal() {
  if (!today) { const d = await api(`/api/bookings?from=2000-01-01&to=2000-01-02`); today = d.today; start = addDays(today, -1); }
  const end = addDays(start, DAYS);
  const d = await api(`/api/bookings?from=${start}&to=${end}`);
  today = d.today;
  notifyNew(d.bookings);
  const act = d.bookings.filter(b => b.status !== 'ยกเลิก');
  act.forEach(b => byNo[b.booking_no] = b);
  const days = [...Array(DAYS)].map((_, i) => addDays(start, i));
  document.getElementById('range').textContent = `${th(start)} – ${th(addDays(end, -1))} ${parts(start).year}`;
  let h = `<table><colgroup><col class="rc">${days.map(() => '<col class="dc">').join('')}</colgroup><thead><tr><th class="rmh">ห้องพัก</th>` +
    days.map(x => { const p = parts(x); return `<th class="${x === today ? 'today' : ''}"><span style="color:${p.wd === 0 || p.wd === 6 ? 'var(--red)' : 'var(--purple)'}">${p.dow}</span><span class="d">${p.day}</span></th>`; }).join('') + '</tr></thead><tbody>';
  for (const zone of ['ตึก', 'บ้าน']) {
    const rooms = d.rooms.filter(r => r.zone === zone);
    h += `<tr class="zone"><td class="rmh" style="background:var(--paper2);font-size:.85rem">โซน${zone} <span class="muted" style="font-weight:500">ว่าง</span></td>` + days.map(x => {
      const occ = act.filter(b => rooms.some(r => r.id === b.room_id) && b.check_in <= x && b.check_out > x).length;
      return `<td style="text-align:center;font-weight:600;font-size:.78rem" title="ห้องว่าง">${rooms.length - occ}</td>`;
    }).join('') + '</tr>';
    for (const r of rooms) {
      const mine = act.filter(b => b.room_id === r.id);
      h += `<tr><td class="rmh">${r.id}</td>` + days.map((x, i) => {
        const p = parts(x);
        let bars = '';
        for (const b of mine) {
          const s = Math.max(0, dayDiff(start, b.check_in)), e = Math.min(DAYS, dayDiff(start, b.check_out));
          if (s !== i || e <= s) continue;
          const cls = b.check_out <= today ? 'past' : b.check_in <= today ? 'now' : 'fut';
          const w = e - s;
          bars += `<button class="bk ${cls} ${b.created_by === 'ai' ? 'ai' : ''}" data-no="${esc(b.booking_no)}" style="width:calc(${w * 100}% + ${w - 1}px - .3rem)" title="${esc(b.guest_name)}">${b.created_by === 'ai' ? '✨' : ''}${esc(b.guest_name)} · ${b.nights} คืน</button>`;
        }
        return `<td class="cell ${x === today ? 'td' : p.wd === 0 || p.wd === 6 ? 'wk' : ''}">${bars}</td>`;
      }).join('') + '</tr>';
    }
  }
  document.getElementById('cal').innerHTML = h + '</tbody></table>';
}

async function loadList() {
  if (!today) { const d = await api(`/api/bookings?from=2000-01-01&to=2000-01-02`); today = d.today; }
  const d = await api(`/api/bookings?from=${addDays(today, -60)}&to=${addDays(today, 120)}`);
  notifyNew(d.bookings);
  listData = d.bookings.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  renderList();
}
function renderList() {
  if (!listData) return;
  const q = document.getElementById('q').value.trim().toLowerCase(), f = document.getElementById('f').value;
  const rows = listData.filter(b => {
    if (f === 'ai' && b.created_by !== 'ai') return false;
    if (f === 'cx' && b.status !== 'ยกเลิก') return false;
    if (f === 'up' && (b.status === 'ยกเลิก' || b.check_in < today)) return false;
    if (f === 'all' && false) return false;
    return !q || [b.guest_name, b.room_id, b.booking_no, b.company, b.phone].some(v => (v || '').toLowerCase().includes(q));
  });
  rows.forEach(b => byNo[b.booking_no] = b);
  document.getElementById('cnt').textContent = `${rows.length} รายการ · เรียงจากจองล่าสุด`;
  document.getElementById('rows').innerHTML = rows.map(b => `<tr data-no="${esc(b.booking_no)}">
    <td>${esc(b.booking_no)}</td><td><b>${esc(b.guest_name)}</b>${b.company ? `<div class="muted" style="font-size:.78rem">${esc(b.company)}</div>` : ''}</td>
    <td>${esc(b.room_id)}</td><td>${th(b.check_in)}</td><td>${th(b.check_out)}</td><td>${b.nights}</td><td>${baht(b.room_total)}</td>
    <td>${b.status === 'ยกเลิก' ? '<span class="chip cx">ยกเลิก</span>' : payChip(b.payment_status)}</td>
    <td>${b.created_by === 'ai' ? aiChip(b) : esc(b.channel)}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">ไม่พบรายการ</td></tr>';
}

async function load() {
  try {
    if (mode === 'cal') await loadCal(); else await loadList();
    document.getElementById('upd').textContent = 'อัปเดตอัตโนมัติ · ล่าสุด ' + time(new Date().toISOString()).split(' ').pop();
  } catch (e) { document.getElementById('upd').textContent = 'โหลดไม่สำเร็จ: ' + e.message; }
}

function setMode(m) {
  mode = m;
  document.getElementById('tCal').setAttribute('aria-pressed', m === 'cal');
  document.getElementById('tList').setAttribute('aria-pressed', m === 'list');
  document.getElementById('calView').classList.toggle('hide', m !== 'cal');
  document.getElementById('listView').classList.toggle('hide', m !== 'list');
  try { localStorage.setItem('pp_bkmode', m); } catch {}
  load();
}
document.getElementById('tCal').onclick = () => setMode('cal');
document.getElementById('tList').onclick = () => setMode('list');
document.getElementById('prev').onclick = () => { start = addDays(start, -7); load(); };
document.getElementById('next').onclick = () => { start = addDays(start, 7); load(); };
document.getElementById('goToday').onclick = () => { start = addDays(today, -1); load(); };
document.getElementById('q').oninput = renderList;
document.getElementById('f').onchange = renderList;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-no]');
  if (el && byNo[el.dataset.no]) bookingDrawer(byNo[el.dataset.no]);
});
let saved = 'cal'; try { saved = localStorage.getItem('pp_bkmode') || 'cal'; } catch {}
setMode(saved === 'list' ? 'list' : 'cal');
setInterval(load, 10000);
api('/api/dashboard').then(d => setBadge(d.chats_need_staff)).catch(() => {});
</script>
</body>
</html>
